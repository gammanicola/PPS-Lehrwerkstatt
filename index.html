function pad(n){return String(n).padStart(2,'0');}
function fmtDate(d){if(!d)return '';var x=d instanceof Date?d:new Date(d);return x.getFullYear()+'-'+pad(x.getMonth()+1)+'-'+pad(x.getDate());}
function fmtD(s){if(!s)return '–';var x=new Date(s);x.setHours(0,0,0,0);return pad(x.getDate())+'.'+pad(x.getMonth()+1)+'.'+x.getFullYear();}
function parseD(s){var d=new Date(s);d.setHours(0,0,0,0);return d;}
function addD(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x;}
function diffD(a,b){return Math.round((parseD(b)-parseD(a))/86400000);}
function isWork(d){return d.getDay()!==0&&d.getDay()!==6;}
function nextWork(d){var x=new Date(d);while(!isWork(x))x=addD(x,1);return x;}
function getKW(d){var t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));t.setUTCDate(t.getUTCDate()+4-(t.getUTCDay()||7));var y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return{kw:Math.ceil((((t-y)/86400000)+1)/7),year:t.getUTCFullYear()};}
function kwKey(yr,kw){return yr+'-W'+pad(kw);}
function mondayOfKW(yr,kw){var j=new Date(yr,0,4),m=new Date(j);m.setDate(j.getDate()-((j.getDay()||7)-1)+(kw-1)*7);m.setHours(0,0,0,0);return m;}
// Echte ISO-Wochen eines Jahres: Der 28.12. liegt immer in der letzten KW (52 oder 53)
function allKWsOfYear(yr){var n=getKW(new Date(yr,11,28)).kw,r=[];for(var k=1;k<=n;k++){r.push({kw:k,year:yr,key:kwKey(yr,k),label:'KW'+pad(k),monday:mondayOfKW(yr,k)});}return r;}
function getKap(o,k){return(o&&o.kap&&o.kap[k])||0;}

// ── Business Logic ──
function calcAuftragStatus(a){var p=a.positionen||[];if(!p.length)return 'keine Positionen';if(p.every(function(x){return x.status==='fertig';}))return 'fertig';if(p.some(function(x){return x.status==='läuft'||x.status==='fertig';}))return 'läuft';return 'offen';}
function calcAuftragVorgabe(a){return(a.positionen||[]).reduce(function(s,p){return s+p.vorgabe;},0);}
function calcZeitgrad(maId,auf){var ss=0,si=0,c=0;auf.forEach(function(a){(a.positionen||[]).forEach(function(p){if(p.maId===maId&&p.status==='fertig'&&p.vorgabe>0&&p.istZeit>0){ss+=p.vorgabe;si+=p.istZeit;c++;}});});if(!c||!si)return null;return +(ss/si*100).toFixed(1);}
function geplantHP(p,m){var zg=m?m.zeitgrad:100;if(!p.vorgabe||zg<=0)return 0;return +(p.vorgabe*(100/zg)).toFixed(2);}
// Maschinentyp Tageskapazität = (kap pro Einheit pro Woche / 5) × Anzahl
// Standard: Ist für MA/Maschine GAR KEINE Kapazität erfasst → 40h/Woche (8h/Tag) pro Einheit
var STD_KAP=40;
function hasCap(o){return !!o&&Object.keys(o.kap||{}).some(function(k){return o.kap[k]>0;});}
function effKapMA(m,k){return hasCap(m)?getKap(m,k):STD_KAP;}
function effKapMS(ms,k){return(hasCap(ms)?getKap(ms,k):STD_KAP)*(ms.anzahl||1);}
function msDayKap(ms,d){var kw=getKW(d);return effKapMS(ms,kwKey(kw.year,kw.kw))/5;}
function maDayKap(ma,d){var kw=getKW(d);return effKapMA(ma,kwKey(kw.year,kw.kw))/5;}

// ── Auto-Schedule ──
function autoScheduleAll(auftraege,maList,msList){
  var result=auftraege.map(function(a){return Object.assign({},a,{positionen:(a.positionen||[]).map(function(p){return Object.assign({},p,{unplanned:0});})});});
  var maUsage={},msUsage={};
  function getU(map,id,ds){return map[id+'_'+ds]||0;}
  function addU(map,id,ds,h){map[id+'_'+ds]=(map[id+'_'+ds]||0)+h;}
  var msMap={};msList.forEach(function(x){msMap[x.id]=x;});

  var maMap={};maList.forEach(function(x){maMap[x.id]=x;});
  // Alle offenen Positionen aller MA – global nach Deadline sortiert (dringendste zuerst)
  var active=[];
  result.forEach(function(a){(a.positionen||[]).forEach(function(p){
    if(p.status==='fertig')return;
    if(maMap[p.maId])active.push({p:p,auf:a});
    else{p.start='';p.end='';p.alloc={};} // kein (gültiger) MA → nicht einplanen, alte Daten entfernen
  });});
  // Laufende Positionen mit «Vorrang» zuerst, danach nach Deadline
  function vr(p){return p.status==='läuft'&&p.vorrang?0:1;}
  active.sort(function(a,b){var v=vr(a.p)-vr(b.p);if(v)return v;var da=a.auf.deadline||'9999-12-31',db=b.auf.deadline||'9999-12-31';return da<db?-1:da>db?1:a.p.id-b.p.id;});

  active.forEach(function(it){
      var ma=maMap[it.p.maId],zg=(ma.zeitgrad>0)?ma.zeitgrad:100;
      var p=it.p,gh=+(p.vorgabe*(100/zg)).toFixed(4);
      if(gh<=0){p.start=fmtDate(today);p.end=fmtDate(today);p.alloc={};return;}
      var ms=p.maschinenTypId?msMap[p.maschinenTypId]:null;
      var rem=gh,cur=nextWork(today),lastDay=new Date(cur),safety=0,started=false;
      p.alloc={}; // tatsächliche Tagesverteilung {datum: stunden}

      while(rem>0.0001&&safety<5000){
        safety++;
        if(!isWork(cur)){cur=addD(cur,1);continue;}
        var ds=fmtDate(cur);
        // MA Kapazität
        var maCap=maDayKap(ma,cur);
        var maAvail=Math.max(0,maCap-getU(maUsage,ma.id,ds));
        if(maAvail<=0.0001){cur=addD(cur,1);continue;}
        // Maschinen Kapazität (Typ × Anzahl)
        var msAvail=999;
        if(ms){
          var msCap=msDayKap(ms,cur);
          msAvail=Math.max(0,msCap-getU(msUsage,ms.id,ds));
          if(msAvail<=0.0001){cur=addD(cur,1);continue;}
        }
        if(!started){p.start=ds;started=true;}
        var consume=Math.min(rem,maAvail,msAvail);
        rem-=consume;
        addU(maUsage,ma.id,ds,consume);
        if(ms)addU(msUsage,ms.id,ds,consume);
        p.alloc[ds]=+((p.alloc[ds]||0)+consume).toFixed(4);
        lastDay=new Date(cur);
        if(rem<=0.0001)break;
        cur=addD(cur,1);
      }
      if(!started)p.start=fmtDate(today);
      p.end=fmtDate(lastDay);
      // Nicht vollständig einplanbar → fehlende Stunden merken
      p.unplanned=rem>0.0001?+rem.toFixed(1):0;
  });
  return result;
}

function getMM(){var m={};ST.ma.forEach(function(x){m[x.id]=x;});return m;}
function getMsM(){var m={};ST.maschinen.forEach(function(x){m[x.id]=x;});return m;}
function persist(){lsSave('pdv4_ma',ST.ma);lsSave('pdv4_auf',ST.auftraege);lsSave('pdv4_ms',ST.maschinen);lsSave('pdv4_kd',ST.kunden);if(window.__onPersist&&!RO)window.__onPersist({ma:ST.ma,auftraege:ST.auftraege,maschinen:ST.maschinen,kunden:ST.kunden});}
function withZG(maList,auf){return maList.map(function(m){var z=calcZeitgrad(m.id,auf);return Object.assign({},m,{zeitgrad:z!=null?z:100});});}
// Fertig-Datum: beim Wechsel auf «fertig» heute eintragen, beim Zurücksetzen entfernen
function stampFertig(plan){var old={};ST.auftraege.forEach(function(a){(a.positionen||[]).forEach(function(p){old[p.id]=p;});});
  plan.forEach(function(a){(a.positionen||[]).forEach(function(p){var o=old[p.id];if(p.status==='fertig'){if(!p.fertigAm&&o&&o.status!=='fertig')p.fertigAm=fmtDate(today);}else if(p.fertigAm)delete p.fertigAm;});});}
function commitPlan(maWZG,ms,plan){stampFertig(plan);ST.ma=maWZG;ST.maschinen=ms;ST.auftraege=plan;ST._stale=false;ST.pendingUpdate=null;persist();render();if(ST._autoMsg){showToast(ST._autoMsg,'#a5b4fc');ST._autoMsg=null;}}
// Änderung übernehmen und neu einplanen.
// Prüft vorher, ob eine laufende Position durch diese Änderung später fertig wird → dann Meldung mit 3 Knöpfen.
function applyUpdate(nAuf,nMA,nMs,opt){
  var ms=nMs||ST.maschinen,maWZG=withZG(nMA,nAuf),plan=autoScheduleAll(nAuf,maWZG,ms);
  if(!(opt&&opt.noCheck)){
    var running=[];plan.forEach(function(a){(a.positionen||[]).forEach(function(p){if(p.status==='läuft'&&p.end)running.push({a:a,p:p});});});
    if(running.length){
      // Vergleich mit einer frischen Planung der Daten VOR der Änderung (nicht mit evtl. veralteten gespeicherten Daten)
      var oldPlan=autoScheduleAll(ST.auftraege,withZG(ST.ma,ST.auftraege),ST.maschinen),oldPos={},oldAuf={};
      oldPlan.forEach(function(a){oldAuf[a.id]=a;(a.positionen||[]).forEach(function(p){oldPos[p.id]=p;});});
      var moved=running.filter(function(x){var o=oldPos[x.p.id];return o&&o.status==='läuft'&&o.end&&dateGT(x.p.end,o.end);})
        .map(function(x){return{aufNr:x.a.nr,pos:x.p,oldEnd:oldPos[x.p.id].end};});
      if(moved.length){
        // Auslöser = neue oder geänderte Positionen dieser Änderung
        var trig=[];nAuf.forEach(function(a){(a.positionen||[]).forEach(function(p){var o=oldPos[p.id],oa=oldAuf[a.id];
          if(!o)trig.push(a.nr+' '+p.nr+' – '+p.bez+' (neu)');
          else if(o.vorgabe!==p.vorgabe||o.maId!==p.maId||o.maschinenTypId!==p.maschinenTypId||o.status!==p.status||(oa&&oa.deadline!==a.deadline))trig.push(a.nr+' '+p.nr+' – '+p.bez+' (geändert)');});});
        ST.pendingUpdate={nAuf:nAuf,nMA:nMA,ms:ms,maWZG:maWZG,plan:plan,moved:moved,trig:trig,
          restore:{aufModal:ST.aufModal,aufForm:ST.aufForm,posModal:ST.posModal,posForm:ST.posForm,posAufId:ST.posAufId,istModal:ST.istModal,istVal:ST.istVal,maModal:ST.maModal,maForm:ST.maForm,msModal:ST.msModal,msForm:ST.msForm}};
        render();return;
      }
    }
  }
  commitPlan(maWZG,ms,plan);
}
function pendingChoice(c){
  var pu=ST.pendingUpdate;if(!pu)return;
  if(c==='cancel'){Object.assign(ST,pu.restore);ST.pendingUpdate=null;ST._autoMsg=null;render();showToast('Änderung verworfen','#a8b8cc');return;}
  if(c==='prio'){var ids={};pu.moved.forEach(function(x){ids[x.pos.id]=true;});
    var nAuf=pu.nAuf.map(function(a){return Object.assign({},a,{positionen:(a.positionen||[]).map(function(p){return ids[p.id]?Object.assign({},p,{vorrang:true}):p;})});});
    var maWZG=withZG(pu.nMA,nAuf);commitPlan(maWZG,pu.ms,autoScheduleAll(nAuf,maWZG,pu.ms));showToast('📌 Laufende Position(en) behalten Vorrang','#22c55e');return;}
  commitPlan(pu.maWZG,pu.ms,pu.plan);
}
// ── Beim Öffnen: ist die gespeicherte Planung noch aktuell? (z.B. App einige Tage später geöffnet) ──

if(!RO&&sMA&&sAuf&&sMs){try{
  var planSig=function(p){return[p.start||'',p.end||'',p.unplanned||0,JSON.stringify(p.alloc||{})].join('|');};
  var fresh={};autoScheduleAll(ST.auftraege,withZG(ST.ma,ST.auftraege),ST.maschinen).forEach(function(a){(a.positionen||[]).forEach(function(p){fresh[p.id]=p;});});
  ST.auftraege.forEach(function(a){(a.positionen||[]).forEach(function(p){if(p.status!=='fertig'&&fresh[p.id]&&planSig(p)!==planSig(fresh[p.id]))ST._stale=true;});});
}catch(e){}}

// Qualifizierte MAs für Maschinentyp
function qualiMA(msId){return ST.ma.filter(function(m){return(m.quali||[]).indexOf(msId)>=0;});}
// Ist der zugewiesene MA für den Maschinentyp der Position qualifiziert? (ohne Maschinentyp immer ok)
function isQualified(p,mm){if(!p.maschinenTypId)return true;var m=mm[p.maId];if(!m)return true;/* fehlender MA wird separat gewarnt */return(m.quali||[]).indexOf(+p.maschinenTypId)>=0;}
function hasNoMA(p,mm){return p.status!=='fertig'&&!mm[p.maId];}
// 🤖 Automatische MA-Zuweisung: qualifizierte MA nach Auslastung bis zur Deadline (ohne/abgelaufene Deadline: nächste 4 Wochen)
// Auslastung = bereits verplante Stunden (offene/laufende Positionen) ÷ Kapazität im Zeitraum. Niedrigste Auslastung gewinnt.
function rankMA(msId,deadline,excludePosId){
  var cands=msId?ST.ma.filter(function(m){return(m.quali||[]).indexOf(msId)>=0;}):ST.ma.slice(),noQuali=false;
  if(msId&&!cands.length){cands=ST.ma.slice();noQuali=true;}
  var from=nextWork(today),dl=deadline?parseD(deadline):null,useDl=!!(dl&&dl>=from),to=useDl?dl:addD(from,27),days=[];
  for(var d=new Date(from);d<=to;d=addD(d,1))if(isWork(d))days.push(fmtDate(d));
  var planned={};ST.auftraege.forEach(function(a){(a.positionen||[]).forEach(function(p){if(p.status==='fertig'||p.id===excludePosId||!p.alloc)return;
    days.forEach(function(ds){var h=p.alloc[ds];if(h)planned[p.maId]=(planned[p.maId]||0)+h;});});});
  var list=cands.map(function(m){var cap=days.reduce(function(s,ds){return s+maDayKap(m,parseD(ds));},0),pl=planned[m.id]||0;
    return{m:m,cap:cap,plan:pl,free:Math.max(0,cap-pl),pct:cap>0?pl/cap*100:Infinity};});
  list.sort(function(a,b){return(a.pct-b.pct)||(b.free-a.free)||a.m.name.localeCompare(b.m.name);});
  var pick=list.filter(function(x){return x.cap>0;})[0]||null;
  return{list:list,pick:pick,useDl:useDl,to:to,noQuali:noQuali};
}

    positionen:(Array.isArray(a.positionen)?a.positionen:[]).filter(isObj).map(function(p){return Object.assign({},p,{id:p.id||newId(),nr:String(p.nr||''),bez:String(p.bez||''),maId:+p.maId||'',maschinenTypId:+p.maschinenTypId||'',vorgabe:Math.max(0,+p.vorgabe||0),istZeit:Math.max(0,+p.istZeit||0),status:st.indexOf(p.status)>=0?p.status:'offen'});})};});

  var msIds={},maIds={};(ms||ST.maschinen).forEach(function(x){msIds[x.id]=true;});ma.forEach(function(x){maIds[x.id]=true;});
  var fixed=0;

// Stunden pro Tag einer Position: exakt aus der Planung (alloc),
// Fallback für alte Daten ohne alloc: gleichmässig auf Arbeitstage (Mo–Fr) verteilt
function posDayHours(p,m){
  if(p.alloc)return Object.keys(p.alloc).map(function(d){return[d,p.alloc[d]];});
  if(!p.start||!p.end)return[];
  var gh=geplantHP(p,m),days=[],c=parseD(p.start),e=parseD(p.end);
  while(c<=e){if(isWork(c))days.push(fmtDate(c));c=addD(c,1);}
  if(!days.length)return[];
  var hpd=gh/days.length;return days.map(function(d){return[d,hpd];});
}

// Verrechnet wird netto in CHF: Stunden × Stundensatz.

//          Externe Kunden und Aufträge ohne Kunde → immer Vorgabezeit.

function fmtCHF(v){return 'CHF '+(Math.round((v||0)*100)/100).toLocaleString('de-CH',{minimumFractionDigits:2,maximumFractionDigits:2});}

function billHours(p,intern){if(intern&&p.status==='fertig')return +(p.istZeit>0?p.istZeit:p.vorgabe)||0;return +p.vorgabe||0;}

function aufBill(a,km){var s=aufSatz(a,km),it=isIntern(a,km),hF=0,hO=0;(a.positionen||[]).forEach(function(p){if(p.status==='fertig')hF+=billHours(p,it);else hO+=billHours(p,it);});
  return{satz:s,hF:hF,hO:hO,bF:hF*s,bO:hO*s,total:(hF+hO)*s,eigen:+a.satz>0,intern:it};}

    screen('Produktions-Dashboard',['Bitte melde dich an.'],[em,pw,err,btn,h('div','font-size:12px;color:#94a3b8;margin-top:14px;line-height:1.5','Noch kein Zugang oder Passwort vergessen? Die Planerin richtet das in Supabase ein.')]);
    setTimeout(function(){em.focus();},0);
  }

  // ── Daten bereinigen für Zuschauer (Datenschutz): kein Zeitgrad, keine Ist-Zeiten,
  //    keine Kunden, keine Stundensätze ──
  function sanitize(full){
    return{v:4,
      ma:(full.ma||[]).map(function(m){return{id:m.id,name:m.name,rolle:m.rolle,kap:m.kap||{},quali:m.quali||[],zeitgrad:100};}),
      maschinen:full.maschinen||[],
      kunden:[],
      auftraege:(full.auftraege||[]).map(function(a){var o=Object.assign({},a,{positionen:(a.positionen||[]).map(function(p){var q=Object.assign({},p);q.istZeit=0;return q;})});delete o.kundeId;delete o.satz;return o;})};
  }

  // ── Start ──
  function boot(){
    loading();
    sb.auth.getSession().then(function(r){
      var s=r&&r.data&&r.data.session;if(!s){showLogin();return;}
      email=(s.user&&s.user.email)||'';
      return sb.from('app_users').select('role,name').maybeSingle().then(function(u){
        if(u.error){screen('Fehler',['Die Benutzerrolle konnte nicht gelesen werden: '+u.error.message],[logoutBtn()]);return;}
        if(!u.data){screen('Kein Zugriff',['Du bist als '+email+' angemeldet, hast aber noch keine Berechtigung für dieses Dashboard.','Die Planerin muss dich in der Benutzerliste eintragen.'],[logoutBtn()]);return;}
        role=u.data.role;name=u.data.name||email;
        return loadPlan(true);
      });
    }).catch(function(e){screen('Keine Verbindung',['Die Datenbank ist nicht erreichbar: '+(e&&e.message||e),'Falls das Projekt pausiert ist: in Supabase wieder starten.'],[logoutBtn()]);});
  }

  function loadPlan(first){
    var id=role==='editor'?'full':'view';
    return sb.from('plan').select('data,version,updated_at,updated_by').eq('id',id).maybeSingle().then(function(r){
      if(r.error)throw r.error;
      if(!r.data){if(role==='editor')showEmpty();else screen('Noch keine Planung',['Die Planerin hat noch keine Planung veröffentlicht.'],[logoutBtn()]);return;}
      VER=r.data.version;metaTs=r.data.updated_at;metaBy=r.data.updated_by||'';
      if(first)start(r.data.data);else{window.__APP.setData(r.data.data);bar();}
    });
  }

  function start(d){
    window.__RO=role!=='editor';
    window.__BOOT_DATA={ma:d.ma||[],auftraege:d.auftraege||[],maschinen:d.maschinen||[],kunden:d.kunden||[]};
    if(role==='editor')window.__onPersist=queueSave;
    window.startApp();
    document.body.style.paddingBottom='52px';
    bar();
    if(role!=='editor')watchViewer();
  }

  // ── Leere Datenbank (nur Planerin, einmalig) ──
  function showEmpty(){
    var b=h('button',BTNP,'Dashboard starten');
    b.onclick=function(){b.disabled=true;b.textContent='Wird eingerichtet …';
      var full={v:4,ma:[],auftraege:[],maschinen:[],kunden:[]},now=new Date().toISOString();
      sb.from('plan').insert([{id:'full',data:full,version:1,updated_at:now,updated_by:email},{id:'view',data:sanitize(full),version:1,updated_at:now,updated_by:email}]).then(function(r){
        if(r.error){b.disabled=false;b.textContent='Dashboard starten';alert('Fehler: '+r.error.message);return;}
        VER=1;metaTs=now;metaBy=email;start(full);});};
    screen('Datenbank ist noch leer',['Willkommen! Es sind noch keine Daten gespeichert.','Klicke auf «Dashboard starten». Lade danach oben rechts über «📥 Import» die JSON-Datei, die du aus dem bisherigen Dashboard exportiert hast.'],[b,logoutBtn()]);
  }

  // ── Speichern (Planerin): gebündelt, mit Versionsprüfung gegen Überschreiben ──
  var pending=null,busy=false,timer=null,status='ok',lastErr='';
  function queueSave(d){pending=d;status='saving';bar();clearTimeout(timer);timer=setTimeout(flush,700);}
  function flush(){
    if(busy||!pending)return;busy=true;clearTimeout(timer);
    var d=pending;pending=null;
    var full={v:4,ma:d.ma,auftraege:d.auftraege,maschinen:d.maschinen,kunden:d.kunden||[]},now=new Date().toISOString();
    sb.from('plan').update({data:full,version:VER+1,updated_at:now,updated_by:email}).eq('id','full').eq('version',VER).select('version').then(function(r){
      if(r.error)throw r.error;
      if(!r.data||!r.data.length){busy=false;conflict();return;}
      VER=VER+1;
      return sb.from('plan').update({data:sanitize(full),version:VER,updated_at:now,updated_by:email}).eq('id','view').then(function(r2){
        if(r2.error)throw r2.error;
        busy=false;metaTs=now;status=pending?'saving':'ok';bar();if(pending)flush();
      });
    }).catch(function(e){busy=false;if(!pending)pending=d;status='error';lastErr=(e&&e.message)||String(e);bar();timer=setTimeout(flush,15000);});
  }
  window.addEventListener('beforeunload',function(e){if(pending||busy){e.preventDefault();e.returnValue='';}});
  function conflict(){
    status='conflict';bar();
    var ov=h('div','position:fixed;inset:0;background:#000a;z-index:10000;display:flex;align-items:center;justify-content:center;padding:16px');
    var c=h('div','max-width:440px;background:#1e293b;border:1px solid #f59e0b;border-radius:14px;padding:24px');
    c.appendChild(h('div','font-size:16px;font-weight:700;margin-bottom:10px;color:#fcd34d','⚠️ Planung wurde an einem anderen Ort geändert'));
    c.appendChild(h('div','font-size:13px;color:#cbd5e1;line-height:1.5;margin-bottom:16px','Die Planung wurde inzwischen in einem anderen Fenster oder auf einem anderen Gerät gespeichert. Damit nichts überschrieben wird, wurde deine letzte Änderung nicht gespeichert. Bitte neu laden und die Änderung nochmals machen.'));
    var b=h('button',BTNP,'Neu laden');b.onclick=function(){location.reload();};c.appendChild(b);ov.appendChild(c);document.body.appendChild(ov);
  }

  // ── Zuschauer: live aktualisieren (Echtzeit + alle 5 Minuten + beim Zurückkehren zum Tab) ──
  function refreshViewer(){return loadPlan(false).catch(function(){});}
  function watchViewer(){
    try{sb.channel('plan-view').on('postgres_changes',{event:'*',schema:'public',table:'plan',filter:'id=eq.view'},function(){refreshViewer();}).subscribe();}catch(e){}
    setInterval(refreshViewer,5*60*1000);
    document.addEventListener('visibilitychange',function(){if(!document.hidden)refreshViewer();});
  }

  // ── Statusleiste unten links ──
  var barEl=null;
  function bar(){
    if(!barEl){barEl=h('div','position:fixed;left:12px;bottom:12px;z-index:900;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#1e293bf2;border:1px solid #334155;border-radius:10px;padding:7px 12px;font-size:12px;color:#cbd5e1;max-width:calc(100vw - 24px);box-shadow:0 4px 16px #0006');document.body.appendChild(barEl);}
    barEl.innerHTML='';
    barEl.appendChild(h('span','font-weight:700',(role==='editor'?'✏️ ':'👁 ')+esc(name)));
    if(role==='editor'){
      var st={ok:['☁️ Gespeichert '+(metaTs?fmtTs(metaTs).split(', ')[1]:''),'#86efac'],saving:['⏳ Speichert …','#fcd34d'],error:['⚠️ Nicht gespeichert – neuer Versuch läuft','#fca5a5'],conflict:['⚠️ Konflikt – bitte neu laden','#fca5a5']}[status];
      var s=h('span','color:'+st[1],st[0]);if(status==='error')s.title=lastErr;barEl.appendChild(s);
    }else{
      barEl.appendChild(h('span','color:#94a3b8','Stand: '+fmtTs(metaTs)));
      if(metaTs&&!isToday(metaTs))barEl.appendChild(h('span','color:#fcd34d','· wird aktualisiert, sobald die Planerin das Dashboard öffnet'));
    }
    var pw=h('button','background:none;border:none;color:#a5b4fc;cursor:pointer;font-size:12px;padding:0','🔑 Passwort');pw.onclick=changePw;barEl.appendChild(pw);
    var lo=h('button','background:none;border:none;color:#a5b4fc;cursor:pointer;font-size:12px;padding:0','Abmelden');lo.onclick=function(){if((pending||busy)&&!confirm('Es wird noch gespeichert. Trotzdem abmelden?'))return;logout();};barEl.appendChild(lo);
  }

  function changePw(){
    var ov=h('div','position:fixed;inset:0;background:#000a;z-index:10000;display:flex;align-items:center;justify-content:center;padding:16px');
    var c=h('div','width:100%;max-width:380px;background:#1e293b;border:1px solid #334155;border-radius:14px;padding:24px');
    c.appendChild(h('div','font-size:16px;font-weight:700;margin-bottom:12px','🔑 Passwort ändern'));
    var a=h('input',INP),b=h('input',INP),err=h('div','font-size:13px;color:#fca5a5;min-height:18px;margin-bottom:8px');a.type=b.type='password';a.placeholder='Neues Passwort (mind. 8 Zeichen)';b.placeholder='Wiederholen';a.autocomplete=b.autocomplete='new-password';
    var ok=h('button',BTNP,'Speichern'),cancel=h('button','width:100%;margin-top:8px;padding:10px;background:transparent;border:1px solid #475569;border-radius:8px;color:#cbd5e1;font-size:13px;cursor:pointer','Abbrechen');
    cancel.onclick=function(){ov.remove();};
    ok.onclick=function(){if(a.value.length<8){err.textContent='Mindestens 8 Zeichen.';return;}if(a.value!==b.value){err.textContent='Die Passwörter stimmen nicht überein.';return;}
      ok.disabled=true;sb.auth.updateUser({password:a.value}).then(function(r){if(r.error){ok.disabled=false;err.textContent=r.error.message;return;}ov.remove();var t=document.getElementById('toast');if(t){t.textContent='🔑 Passwort geändert';t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2500);}});};
    [a,b,err,ok,cancel].forEach(function(x){c.appendChild(x);});ov.appendChild(c);document.body.appendChild(ov);setTimeout(function(){a.focus();},0);
  }

  if(sb.auth.onAuthStateChange)sb.auth.onAuthStateChange(function(ev){if(ev==='SIGNED_OUT'&&role)location.reload();});
  boot();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Produktions-Dashboard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0f1e;color:#f1f5f9;font-family:'Segoe UI',system-ui,sans-serif;font-size:14px}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:#1e293b}
::-webkit-scrollbar-thumb{background:#334155;border-radius:3px}
button,input,select{font-family:inherit}
.tab{padding:10px 13px;background:none;border:none;border-bottom:2px solid transparent;color:#a8b8cc;font-weight:400;font-size:13px;white-space:nowrap;cursor:pointer}
.tab.active{border-bottom-color:#6366f1;color:#6366f1;font-weight:700}
.fg{margin-bottom:10px}
.fg label{display:block;font-size:12px;color:#cbd5e1;margin-bottom:4px}
.fg input,.fg select{width:100%;background:#0f172a;border:1px solid #334155;border-radius:6px;padding:7px 10px;color:#f1f5f9;font-size:13px}
#toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#1e293b;border:1px solid #334155;border-radius:10px;padding:12px 24px;font-size:13px;font-weight:600;color:#f1f5f9;z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none}
#toast.show{opacity:1}
</style>
</head>
<body>
<div id="root"><div style="display:flex;align-items:center;justify-content:center;height:100vh;color:#6366f1;font-size:20px">⏳ Lädt...</div></div>
<div id="toast"></div>
<input type="file" id="importFile" accept=".json" style="display:none"/>
<script>
(function(){
'use strict';
function showToast(m,c){var t=document.getElementById('toast');t.textContent=m;t.style.borderColor=c||'#334155';t.style.color=c||'#f1f5f9';t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2500);}
function pad(n){return String(n).padStart(2,'0');}
function fmtDate(d){if(!d)return '';var x=d instanceof Date?d:new Date(d);return x.getFullYear()+'-'+pad(x.getMonth()+1)+'-'+pad(x.getDate());}
function fmtD(s){if(!s)return '–';var x=new Date(s);x.setHours(0,0,0,0);return pad(x.getDate())+'.'+pad(x.getMonth()+1)+'.'+x.getFullYear();}
function parseD(s){var d=new Date(s);d.setHours(0,0,0,0);return d;}
function addD(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x;}
function diffD(a,b){return Math.round((parseD(b)-parseD(a))/86400000);}
function isWork(d){return d.getDay()!==0&&d.getDay()!==6;}
function nextWork(d){var x=new Date(d);while(!isWork(x))x=addD(x,1);return x;}
function getKW(d){var t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));t.setUTCDate(t.getUTCDate()+4-(t.getUTCDay()||7));var y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return{kw:Math.ceil((((t-y)/86400000)+1)/7),year:t.getUTCFullYear()};}
function kwKey(yr,kw){return yr+'-W'+pad(kw);}
function mondayOfKW(yr,kw){var j=new Date(yr,0,4),m=new Date(j);m.setDate(j.getDate()-((j.getDay()||7)-1)+(kw-1)*7);m.setHours(0,0,0,0);return m;}
function allKWsOfYear(yr){var r=[];for(var k=1;k<=53;k++){var m=mondayOfKW(yr,k);if(m.getFullYear()>yr&&k>1)break;if(m.getFullYear()<yr)continue;r.push({kw:k,year:yr,key:kwKey(yr,k),label:'KW'+pad(k),monday:m});}return r;}
function getKap(o,k){return(o&&o.kap&&o.kap[k])||0;}
function newId(){return Date.now()+Math.floor(Math.random()*9999);}
function dateGT(a,b){if(!a||!b)return false;return parseD(a)>parseD(b);}
var today=new Date();today.setHours(0,0,0,0);
var CY=today.getFullYear(),todayKW=getKW(today);
var S_COL={offen:'#f59e0b','läuft':'#6366f1',fertig:'#22c55e'};
function lsSave(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function lsLoad(k,fb){try{var s=localStorage.getItem(k);return s?JSON.parse(s):fb;}catch(e){return fb;}}

// ── Business Logic ──
function calcAuftragStatus(a){var p=a.positionen||[];if(!p.length)return 'keine Positionen';if(p.every(function(x){return x.status==='fertig';}))return 'fertig';if(p.some(function(x){return x.status==='läuft'||x.status==='fertig';}))return 'läuft';return 'offen';}
function calcAuftragVorgabe(a){return(a.positionen||[]).reduce(function(s,p){return s+p.vorgabe;},0);}
function calcZeitgrad(maId,auf){var ss=0,si=0,c=0;auf.forEach(function(a){(a.positionen||[]).forEach(function(p){if(p.maId===maId&&p.status==='fertig'&&p.vorgabe>0&&p.istZeit>0){ss+=p.vorgabe;si+=p.istZeit;c++;}});});if(!c||!si)return null;return +(ss/si*100).toFixed(1);}
function geplantHP(p,m){var zg=m?m.zeitgrad:100;if(!p.vorgabe||zg<=0)return 0;return +(p.vorgabe*(100/zg)).toFixed(2);}
// Maschinentyp Tageskapazität = (kap pro Einheit pro Woche / 5) × Anzahl
function msDayKap(ms,d){var kw=getKW(d),k=kwKey(kw.year,kw.kw);return(getKap(ms,k)/5)*(ms.anzahl||1);}
function maDayKap(ma,d){var kw=getKW(d),k=kwKey(kw.year,kw.kw);return getKap(ma,k)/5;}

// ── Auto-Schedule ──
function autoScheduleAll(auftraege,maList,msList){
  var result=auftraege.map(function(a){return Object.assign({},a,{positionen:(a.positionen||[]).map(function(p){return Object.assign({},p);})});});
  var maUsage={},msUsage={};
  function getU(map,id,ds){return map[id+'_'+ds]||0;}
  function addU(map,id,ds,h){map[id+'_'+ds]=(map[id+'_'+ds]||0)+h;}
  var msMap={};msList.forEach(function(x){msMap[x.id]=x;});

  maList.forEach(function(ma){
    var zg=(ma.zeitgrad>0)?ma.zeitgrad:100;
    var active=[];
    result.forEach(function(a){(a.positionen||[]).forEach(function(p){if(p.maId===ma.id&&p.status!=='fertig')active.push({p:p,auf:a});});});
    if(!active.length)return;
    active.sort(function(a,b){var da=a.auf.deadline||'9999-12-31',db=b.auf.deadline||'9999-12-31';return da<db?-1:da>db?1:a.p.id-b.p.id;});
    var hasAnyCap=Object.keys(ma.kap||{}).some(function(k){return ma.kap[k]>0;});

    active.forEach(function(it){
      var p=it.p,gh=+(p.vorgabe*(100/zg)).toFixed(4);
      if(gh<=0){p.start=fmtDate(today);p.end=fmtDate(today);return;}
      var ms=p.maschinenTypId?msMap[p.maschinenTypId]:null;
      var rem=gh,cur=nextWork(today),lastDay=new Date(cur),safety=0,started=false;

      while(rem>0.0001&&safety<5000){
        safety++;
        if(!isWork(cur)){cur=addD(cur,1);continue;}
        var ds=fmtDate(cur);
        // MA Kapazität
        var maCap=hasAnyCap?maDayKap(ma,cur):8;
        var maAvail=Math.max(0,maCap-getU(maUsage,ma.id,ds));
        if(maAvail<=0.0001){cur=addD(cur,1);continue;}
        // Maschinen Kapazität (Typ × Anzahl)
        var msAvail=999;
        if(ms){
          var msCap=msDayKap(ms,cur);
          msAvail=Math.max(0,msCap-getU(msUsage,ms.id,ds));
          if(msAvail<=0.0001){cur=addD(cur,1);continue;}
        }
        if(!started){p.start=ds;started=true;}
        var consume=Math.min(rem,maAvail,msAvail);
        rem-=consume;
        addU(maUsage,ma.id,ds,consume);
        if(ms)addU(msUsage,ms.id,ds,consume);
        lastDay=new Date(cur);
        if(rem<=0.0001)break;
        cur=addD(cur,1);
      }
      if(!started)p.start=fmtDate(today);
      p.end=fmtDate(lastDay);
    });
  });
  return result;
}

// ── Default Data ──
var defMasch=[
  {id:1,name:'Schweissroboter',typ:'Fix',anzahl:1,kap:{}},
  {id:2,name:'Lackierkabine',typ:'Fix',anzahl:1,kap:{}},
  {id:3,name:'CNC Fräse',typ:'Typ',anzahl:5,kap:{}},
  {id:4,name:'Drehmaschine',typ:'Typ',anzahl:5,kap:{}}
];
var defMA=[
  {id:1,name:'Thomas Müller',rolle:'Schlosser',zeitgrad:100,kap:{},quali:[1,4]},
  {id:2,name:'Anna Schmidt',rolle:'Lackiererin',zeitgrad:100,kap:{},quali:[2]},
  {id:3,name:'Klaus Weber',rolle:'Monteur',zeitgrad:100,kap:{},quali:[3]},
  {id:4,name:'Sara Braun',rolle:'CNC-Fräser',zeitgrad:100,kap:{},quali:[3,4]}
];
var defAuf=[
  {id:1,nr:'AU-1001',bez:'Stahlrahmen Charge A',deadline:fmtDate(addD(today,20)),notiz:'',positionen:[
    {id:101,nr:'Pos 1',bez:'Schweissen Grundrahmen',maId:1,maschinenTypId:1,vorgabe:5,istZeit:0,status:'offen'},
    {id:102,nr:'Pos 2',bez:'Lackierung Rahmen',maId:2,maschinenTypId:2,vorgabe:2,istZeit:0,status:'offen'},
    {id:103,nr:'Pos 3',bez:'Drehen Bolzen',maId:1,maschinenTypId:4,vorgabe:3,istZeit:0,status:'offen'}
  ]},
  {id:2,nr:'AU-1002',bez:'Maschinensockel B',deadline:fmtDate(addD(today,15)),notiz:'Eilauftrag',positionen:[
    {id:201,nr:'Pos 1',bez:'Fräsung Grundplatte',maId:4,maschinenTypId:3,vorgabe:6,istZeit:0,status:'offen'},
    {id:202,nr:'Pos 2',bez:'Drehen Achse',maId:4,maschinenTypId:4,vorgabe:4,istZeit:0,status:'offen'}
  ]},
  {id:3,nr:'AU-1003',bez:'Türverkleidung Set',deadline:fmtDate(addD(today,8)),notiz:'',positionen:[
    {id:301,nr:'Pos 1',bez:'Lackierung Türen',maId:2,maschinenTypId:2,vorgabe:5,istZeit:4,status:'läuft'},
    {id:302,nr:'Pos 2',bez:'Fräsung Beschlag',maId:3,maschinenTypId:3,vorgabe:3,istZeit:3,status:'fertig'}
  ]}
];

var sMA=lsLoad('pdv4_ma',null),sAuf=lsLoad('pdv4_auf',null),sMs=lsLoad('pdv4_ms',null);
var initMA,initAuf,initMs;
if(sMA&&sAuf&&sMs){initMA=sMA;initAuf=sAuf;initMs=sMs;}
else{initMs=defMasch.slice();initMA=defMA.map(function(m){var z=calcZeitgrad(m.id,defAuf);return Object.assign({},m,{zeitgrad:z!=null?z:100});});initAuf=autoScheduleAll(defAuf,initMA,initMs);}

var ST={tab:'dashboard',search:'',statusFilter:'alle',year:CY,kapYear:CY,ganttStart:fmtDate(addD(today,-2)),ganttDays:28,expanded:{},
  aufModal:null,aufForm:{},posModal:null,posForm:{},posAufId:null,istModal:null,istVal:'',
  maModal:null,maForm:{},kapModal:null,msModal:null,msForm:{},msKapModal:null,
  ma:initMA,auftraege:initAuf,maschinen:initMs,_searchFocus:false,_dashOff:null};

function getMM(){var m={};ST.ma.forEach(function(x){m[x.id]=x;});return m;}
function getMsM(){var m={};ST.maschinen.forEach(function(x){m[x.id]=x;});return m;}
function persist(){lsSave('pdv4_ma',ST.ma);lsSave('pdv4_auf',ST.auftraege);lsSave('pdv4_ms',ST.maschinen);}
function applyUpdate(nAuf,nMA,nMs){
  var ms=nMs||ST.maschinen;
  var maWZG=nMA.map(function(m){var z=calcZeitgrad(m.id,nAuf);return Object.assign({},m,{zeitgrad:z!=null?z:100});});
  ST.ma=maWZG;ST.maschinen=ms;ST.auftraege=autoScheduleAll(nAuf,maWZG,ms);persist();render();
}
// Qualifizierte MAs für Maschinentyp
function qualiMA(msId){return ST.ma.filter(function(m){return(m.quali||[]).indexOf(msId)>=0;});}

// Export/Import
function exportJSON(){var d={version:4,exportedAt:new Date().toISOString(),ma:ST.ma,auftraege:ST.auftraege,maschinen:ST.maschinen};var b=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});var u=URL.createObjectURL(b);var a=document.createElement('a');a.href=u;a.download='dashboard-'+fmtDate(today)+'.json';a.click();URL.revokeObjectURL(u);showToast('📤 Export erfolgreich!','#6366f1');}
document.getElementById('importFile').onchange=function(ev){var f=ev.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(e){try{var d=JSON.parse(e.target.result);if(!d.ma||!d.auftraege)throw new Error('Ungültig');if(!confirm('Alle Daten überschreiben?'))return;ST.ma=d.ma;ST.auftraege=d.auftraege;ST.maschinen=d.maschinen||defMasch;persist();render();showToast('📥 Import erfolgreich!','#22c55e');}catch(err){showToast('❌ '+err.message,'#ef4444');}};r.readAsText(f);ev.target.value='';};

// DOM
function mk(t,c,ch){var e=document.createElement(t);if(c)Object.assign(e.style,c);if(ch==null)return e;(Array.isArray(ch)?ch:[ch]).forEach(function(x){if(x==null||x===false)return;e.appendChild(typeof x==='string'||typeof x==='number'?document.createTextNode(String(x)):x);});return e;}
function D(c,ch){return mk('div',c,ch);}
function SP(c,t){var s=document.createElement('span');if(c)Object.assign(s.style,c);if(t!=null)s.textContent=String(t);return s;}
function BTN(t,c,sm,fn,ol){var co=c||'#6366f1',b=document.createElement('button');b.style.cssText='padding:'+(sm?'5px 10px':'8px 16px')+';background:'+(ol?'transparent':co)+';border:1px solid '+co+';border-radius:7px;color:'+(ol?co:'#fff')+';font-size:'+(sm?12:13)+'px;font-weight:600;cursor:pointer;white-space:nowrap;';b.textContent=t;if(fn)b.onclick=fn;return b;}
function FG(l,v,fn,opts){var w=document.createElement('div');w.className='fg';if(l){var lb=document.createElement('label');lb.textContent=l;w.appendChild(lb);}var f;if(opts){f=document.createElement('select');opts.forEach(function(o){var op=document.createElement('option');op.value=String(o.v!=null?o.v:o);op.textContent=String(o.l!=null?o.l:o);if(String(o.v!=null?o.v:o)===String(v))op.selected=true;f.appendChild(op);});f.onchange=function(ev){fn(ev.target.value);};}else{f=document.createElement('input');f.value=v!=null?String(v):'';f.onblur=function(ev){fn(ev.target.value);};f.onkeydown=function(ev){if(ev.key==='Enter')fn(ev.target.value);};}w.appendChild(f);return w;}
function FGT(l,ty,v,fn){var w=document.createElement('div');w.className='fg';if(l){var lb=document.createElement('label');lb.textContent=l;w.appendChild(lb);}var f=document.createElement('input');f.type=ty;f.value=v!=null?String(v):'';f.onblur=function(ev){fn(ev.target.value);};f.onkeydown=function(ev){if(ev.key==='Enter')fn(ev.target.value);};w.appendChild(f);return w;}
function MODAL(title,closeFn,wide,parts){var ov=D({position:'fixed',inset:'0',background:'rgba(0,0,0,.75)',zIndex:'100',display:'flex',alignItems:'center',justifyContent:'center'});var bx=D({background:'#1e293b',borderRadius:'14px',padding:'24px',width:wide?'min(860px,95vw)':'min(460px,95vw)',maxHeight:'90vh',overflowY:'auto',border:'1px solid #334155'});var h=D({display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'18px'});var tt=document.createElement('b');tt.style.fontSize='16px';tt.textContent=title;h.appendChild(tt);h.appendChild(BTN('×','#a8b8cc',true,closeFn,true));bx.appendChild(h);parts.forEach(function(p){if(p)bx.appendChild(p);});ov.appendChild(bx);return ov;}
function PROG(p,c){var b=D({background:'#0f172a',borderRadius:'99px',height:'6px'});b.appendChild(D({width:Math.min(p,100)+'%',background:c||'#6366f1',height:'100%',borderRadius:'99px'}));return b;}
function badge(s){var sp=document.createElement('span');sp.textContent=s;sp.style.cssText='display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700;background:'+(S_COL[s]||'#334155')+'22;color:'+(S_COL[s]||'#94a3b8')+';border:1px solid '+(S_COL[s]||'#334155')+'44;white-space:nowrap;';return sp;}

function buildVpKW(mm){var v={};ST.auftraege.forEach(function(a){(a.positionen||[]).forEach(function(p){if(!p.start||!p.end)return;var m=mm[p.maId],gh=geplantHP(p,m),ds=Math.max(1,diffD(p.start,p.end)+1),hpd=gh/ds,c=parseD(p.start),e=parseD(p.end);while(c<=e){if(isWork(c)){var kw=getKW(c),k=kwKey(kw.year,kw.kw);if(!v[k])v[k]={_total:0};v[k][p.maId]=(v[k][p.maId]||0)+hpd;v[k]._total=(v[k]._total||0)+hpd;}c=addD(c,1);}});});return v;}
function buildMsVpKW(){var v={};ST.auftraege.forEach(function(a){(a.positionen||[]).forEach(function(p){if(!p.start||!p.end||!p.maschinenTypId)return;var gh=p.vorgabe,ds=Math.max(1,diffD(p.start,p.end)+1),hpd=gh/ds,c=parseD(p.start),e=parseD(p.end);while(c<=e){if(isWork(c)){var kw=getKW(c),k=kwKey(kw.year,kw.kw);if(!v[k])v[k]={_total:0};v[k][p.maschinenTypId]=(v[k][p.maschinenTypId]||0)+hpd;v[k]._total=(v[k]._total||0)+hpd;}c=addD(c,1);}});});return v;}

// ══════════ DASHBOARD ══════════
function tabDashboard(mm){
  var wrap=D(null),vpKW=buildVpKW(mm),msVpKW=buildMsVpKW();
  // KPIs
  var offen=0,laeuft=0,fertig=0,posGes=0;
  ST.auftraege.forEach(function(a){var s=calcAuftragStatus(a);if(s==='offen')offen++;else if(s==='läuft')laeuft++;else if(s==='fertig')fertig++;posGes+=(a.positionen||[]).length;});
  var zgV=ST.ma.map(function(m){return calcZeitgrad(m.id,ST.auftraege);}).filter(function(v){return v!==null;}),avgZG=zgV.length?(zgV.reduce(function(s,v){return s+v;},0)/zgV.length).toFixed(1):'–';
  var kpiRow=D({display:'flex',gap:'12px',marginBottom:'20px',flexWrap:'wrap'});
  [{l:'Offen',v:offen,i:'📋',c:'#f59e0b'},{l:'In Bearbeitung',v:laeuft,i:'⚙️',c:'#6366f1'},{l:'Fertiggestellt',v:fertig,i:'✅',c:'#22c55e'},{l:'Positionen',v:posGes,i:'📌',c:'#0ea5e9'},{l:'Ø Zeitgrad',v:avgZG+(avgZG!=='–'?'%':''),i:'⏱️',c:'#e879f9'}].forEach(function(k){
    kpiRow.appendChild(D({flex:'1',minWidth:'120px',background:'#1e293b',borderRadius:'12px',padding:'14px',border:'1px solid '+k.c+'33'},[D({fontSize:'18px',marginBottom:'4px'},k.i),D({fontSize:'20px',fontWeight:'700',color:k.c},String(k.v)),D({fontSize:'11px',color:'#a8b8cc',marginTop:'2px'},k.l)]));
  });wrap.appendChild(kpiRow);

  // KW data
  var allKWs=[];for(var wi=1;wi<=52;wi++){var wk=kwKey(CY,wi),kg=ST.ma.reduce(function(s,m){return s+getKap(m,wk);},0),vp=(vpKW[wk]&&vpKW[wk]._total)||0;allKWs.push({label:'KW'+pad(wi),key:wk,kap:+kg.toFixed(1),verp:+vp.toFixed(1),ausl:kg>0?Math.round(vp/kg*100):0});}
  var WIN=12,maxOff=allKWs.length-WIN;if(ST._dashOff==null)ST._dashOff=Math.max(0,Math.min(todayKW.kw-3,maxOff));
  var dKWs=allKWs.slice(ST._dashOff,ST._dashOff+WIN),ci=-1;dKWs.forEach(function(w,i){if(w.key===kwKey(todayKW.year,todayKW.kw))ci=i;});
  function navR(){var n=D({display:'flex',gap:'6px'});n.appendChild(BTN('◀','#6366f1',true,function(){ST._dashOff=Math.max(0,ST._dashOff-1);render();}));n.appendChild(BTN('Heute','#334155',true,function(){ST._dashOff=Math.max(0,Math.min(todayKW.kw-3,maxOff));render();},true));n.appendChild(BTN('▶','#6366f1',true,function(){ST._dashOff=Math.min(maxOff,ST._dashOff+1);render();}));return n;}
  var W=880,H=200,PL=38,PR=16,PT=22,PB=24,cW=W-PL-PR,cH=H-PT-PB,PL2=38,PR2=36,maxP=120,cW2=W-PL2-PR2;

  // Chart 1: Kap & Verplant
  var c1=D({background:'#1e293b',borderRadius:'12px',padding:'18px',marginBottom:'14px',border:'1px solid #334155'});
  var c1h=D({display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'10px',flexWrap:'wrap',gap:'8px'});
  c1h.appendChild(SP({fontWeight:'700',fontSize:'13px'},'📦 Kapazität & Verplant – '+dKWs[0].label+' bis '+dKWs[dKWs.length-1].label));c1h.appendChild(navR());c1.appendChild(c1h);
  var maxH=Math.max(1,Math.max.apply(null,dKWs.map(function(d){return Math.max(d.kap,d.verp);}))),bW=Math.max(6,Math.floor(cW/dKWs.length)-8);
  var p=['<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;display:block">'];
  for(var gi=0;gi<=4;gi++){var gy=PT+cH-(gi/4)*cH;p.push('<line x1="'+PL+'" y1="'+gy+'" x2="'+(W-PR)+'" y2="'+gy+'" stroke="#1e293b"/>');p.push('<text x="'+(PL-4)+'" y="'+(gy+4)+'" text-anchor="end" fill="#64748b" font-size="10">'+Math.round(maxH/4*gi)+'h</text>');}

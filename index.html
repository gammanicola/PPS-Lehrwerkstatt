<style>

#toast.show{opacity:1}
</style>

<body>
<div id="root"><div style="display:flex;align-items:center;justify-content:center;height:100vh;color:#6366f1;font-size:20px">⏳ Lädt...</div></div>
<div id="toast"></div>
<input type="file" id="importFile" accept=".json" style="display:none"/>
<script>
(function(){
'use strict';

// ── Toast ──
function showToast(msg,color){
  var t=document.getElementById('toast');
  t.textContent=msg;t.style.borderColor=color||'#334155';t.style.color=color||'#f1f5f9';
  t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2500);
}

// ── Helpers ──
function pad(n){return String(n).padStart(2,'0');}
function fmtDate(d){if(!d)return '';var x=d instanceof Date?d:new Date(d);return x.getFullYear()+'-'+pad(x.getMonth()+1)+'-'+pad(x.getDate());}
function fmtD(s){if(!s)return '–';var x=new Date(s);x.setHours(0,0,0,0);return pad(x.getDate())+'.'+pad(x.getMonth()+1)+'.'+x.getFullYear();}
function parseD(s){var d=new Date(s);d.setHours(0,0,0,0);return d;}
function addD(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x;}
function diffD(a,b){return Math.round((parseD(b)-parseD(a))/86400000);}
function isWork(d){return d.getDay()!==0&&d.getDay()!==6;}
function nextWork(d){var x=new Date(d);while(!isWork(x))x=addD(x,1);return x;}
function getKW(d){
  var t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  t.setUTCDate(t.getUTCDate()+4-(t.getUTCDay()||7));
  var y=new Date(Date.UTC(t.getUTCFullYear(),0,1));
  return {kw:Math.ceil((((t-y)/86400000)+1)/7),year:t.getUTCFullYear()};
}
function kwKey(yr,kw){return yr+'-W'+pad(kw);}
function mondayOfKW(yr,kw){var j=new Date(yr,0,4),m=new Date(j);m.setDate(j.getDate()-((j.getDay()||7)-1)+(kw-1)*7);m.setHours(0,0,0,0);return m;}
function allKWsOfYear(yr){
  var res=[];
  for(var kw=1;kw<=53;kw++){var mon=mondayOfKW(yr,kw);if(mon.getFullYear()>yr&&kw>1)break;if(mon.getFullYear()<yr)continue;res.push({kw:kw,year:yr,key:kwKey(yr,kw),label:'KW'+pad(kw),monday:mon});}
  return res;
}
function getKap(ma,k){return (ma.kap&&ma.kap[k])||0;}
function newId(){return Date.now()+Math.floor(Math.random()*9999);}

var today=new Date();today.setHours(0,0,0,0);
var CY=today.getFullYear();
var todayKW=getKW(today);
var S_COL={offen:'#f59e0b','läuft':'#6366f1',fertig:'#22c55e'};

// ── localStorage ──
function lsSave(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function lsLoad(k,fb){try{var s=localStorage.getItem(k);return s?JSON.parse(s):fb;}catch(e){return fb;}}

// ── Business Logic ──
function calcAuftragStatus(auf){
  var pos=auf.positionen||[];
  if(!pos.length)return 'offen';
  if(pos.every(function(p){return p.status==='fertig';}))return 'fertig';
  if(pos.some(function(p){return p.status==='läuft'||p.status==='fertig';}))return 'läuft';
  return 'offen';
}
function calcAuftragVorgabe(auf){return (auf.positionen||[]).reduce(function(s,p){return s+p.vorgabe;},0);}
function calcZeitgrad(maId,auftraege){
  var ss=0,si=0,cnt=0;
  auftraege.forEach(function(auf){
    (auf.positionen||[]).forEach(function(p){
      if(p.maId===maId&&p.status==='fertig'&&p.vorgabe>0&&p.istZeit>0){ss+=p.vorgabe;si+=(p.istZeit||0);cnt++;}
    });
  });
  if(!cnt||!si)return null;
  return +(ss/si*100).toFixed(1);
}
function geplantHP(pos,m){
  var zg=m?m.zeitgrad:100;
  if(!pos.vorgabe||zg<=0)return 0;
  return +(pos.vorgabe*(100/zg)).toFixed(2);
}

// ── Auto-Schedule ──
function autoScheduleAll(auftraege,maList){
  // Deep copy
  var result=auftraege.map(function(auf){
    return Object.assign({},auf,{positionen:(auf.positionen||[]).map(function(p){return Object.assign({},p);})});
  });

  maList.forEach(function(ma){
    var zg=ma.zeitgrad!=null?ma.zeitgrad:100;

    // Collect active (non-fertig) positions for this MA
    var active=[];
    result.forEach(function(auf){
      (auf.positionen||[]).forEach(function(p){
        if(p.maId===ma.id&&p.status!=='fertig')active.push({p:p,auf:auf});
      });
    });

    // Sort by auftrag deadline
    active.sort(function(a,b){
      var da=a.auf.deadline||'9999-12-31',db=b.auf.deadline||'9999-12-31';
      return da<db?-1:da>db?1:0;
    });

    // Check capacity
    var kapEntries=Object.keys(ma.kap||{});
    var hasAnyCap=false;
    for(var ki=0;ki<kapEntries.length;ki++){if(ma.kap[kapEntries[ki]]>0){hasAnyCap=true;break;}}

    if(!hasAnyCap){
      var cur0=nextWork(today);
      active.forEach(function(item){
        item.p.start=fmtDate(cur0);
        var gh=geplantHP(item.p,ma);
        item.p.end=fmtDate(addD(cur0,Math.max(1,Math.ceil(gh))));
      });
      return;
    }

    // Find first week with capacity
    var curDay=nextWork(today);
    for(var wi=0;wi<200;wi++){
      var kw0=getKW(curDay);
      if(getKap(ma,kwKey(kw0.year,kw0.kw))>0)break;
      curDay=addD(mondayOfKW(kw0.year,kw0.kw),7);
      while(!isWork(curDay))curDay=addD(curDay,1);
    }
    var ck=getKW(curDay);
    var remToday=getKap(ma,kwKey(ck.year,ck.kw))/5;

    active.forEach(function(item){
      var p=item.p;
      var gh=zg>0?+(p.vorgabe/(zg/100)).toFixed(4):p.vorgabe;
      var rem=gh,cur=new Date(curDay),curRem=remToday,lastDay=new Date(curDay),safety=0;
      p.start=fmtDate(cur);
      while(rem>0.0001&&safety<2000){
        safety++;
        var kw=getKW(cur),k=kwKey(kw.year,kw.kw),kapW=getKap(ma,k);
        if(!kapW){
          cur=addD(mondayOfKW(kw.year,kw.kw),7);while(!isWork(cur))cur=addD(cur,1);
          var nk=getKW(cur);curRem=getKap(ma,kwKey(nk.year,nk.kw))/5;continue;
        }
        if(curRem<=0){
          cur=addD(cur,1);while(!isWork(cur))cur=addD(cur,1);
          var k2=getKW(cur);if(!getKap(ma,kwKey(k2.year,k2.kw))){cur=addD(mondayOfKW(k2.year,k2.kw),7);while(!isWork(cur))cur=addD(cur,1);}
          var k3=getKW(cur);curRem=getKap(ma,kwKey(k3.year,k3.kw))/5;continue;
        }
        var consume=Math.min(rem,curRem);rem-=consume;curRem-=consume;lastDay=new Date(cur);
        if(rem<=0.0001)break;
        if(curRem<=0.0001){
          cur=addD(cur,1);while(!isWork(cur))cur=addD(cur,1);
          var k4=getKW(cur);if(!getKap(ma,kwKey(k4.year,k4.kw))){cur=addD(mondayOfKW(k4.year,k4.kw),7);while(!isWork(cur))cur=addD(cur,1);}
          var k5=getKW(cur);curRem=getKap(ma,kwKey(k5.year,k5.kw))/5;
        }
      }
      p.end=fmtDate(lastDay);
      curDay=new Date(lastDay);remToday=curRem<=0.0001?0:curRem;
    });
  });
  return result;
}

// ── Init Data ──
var defaultMA=[
  {id:1,name:'Thomas Müller',rolle:'Schlosser',zeitgrad:85,kap:{}},
  {id:2,name:'Anna Schmidt',rolle:'Lackiererin',zeitgrad:92,kap:{}},
  {id:3,name:'Klaus Weber',rolle:'Monteur',zeitgrad:75,kap:{}},
  {id:4,name:'Sara Braun',rolle:'CNC-Fräser',zeitgrad:100,kap:{}}
];
var defaultAuftraege=[
  {id:1,nr:'AU-1001',bez:'Stahlrahmen Charge A',deadline:fmtDate(addD(today,20)),notiz:'',positionen:[
    {id:101,nr:'Pos 1',bez:'Zuschnitt Flachstahl',maId:1,vorgabe:3,istZeit:0,status:'offen'},
    {id:102,nr:'Pos 2',bez:'Schweissen Grundrahmen',maId:1,vorgabe:5,istZeit:0,status:'offen'},
    {id:103,nr:'Pos 3',bez:'Lackierung Rahmen',maId:2,vorgabe:2,istZeit:0,status:'offen'}
  ]},
  {id:2,nr:'AU-1002',bez:'Maschinensockel B',deadline:fmtDate(addD(today,15)),notiz:'Eilauftrag',positionen:[
    {id:201,nr:'Pos 1',bez:'Fräsung Grundplatte',maId:4,vorgabe:6,istZeit:0,status:'offen'},
    {id:202,nr:'Pos 2',bez:'Montage Schraubenverbindung',maId:3,vorgabe:4,istZeit:0,status:'offen'}
  ]},
  {id:3,nr:'AU-1003',bez:'Türverkleidung Set',deadline:fmtDate(addD(today,8)),notiz:'',positionen:[
    {id:301,nr:'Pos 1',bez:'Lackierung Türen',maId:2,vorgabe:5,istZeit:4,status:'läuft'},
    {id:302,nr:'Pos 2',bez:'Montage Beschläge',maId:3,vorgabe:3,istZeit:3,status:'fertig'}
  ]}
];

// Load from storage or use defaults
var savedMA=lsLoad('pdv2_ma',null);
var savedAuf=lsLoad('pdv2_auf',null);

var initMA, initAuf;
if(savedMA&&savedAuf){
  initMA=savedMA;
  initAuf=savedAuf;
} else {
  initMA=defaultMA.map(function(m){
    var zg=calcZeitgrad(m.id,defaultAuftraege);
    return Object.assign({},m,{zeitgrad:zg!=null?zg:m.zeitgrad});
  });
  initAuf=autoScheduleAll(defaultAuftraege,initMA);
}

// ── State ──
  var ST={
  tab:'dashboard',
  search:'',statusFilter:'alle',
  year:CY,kapYear:CY,
  ganttStart:fmtDate(addD(today,-2)),ganttDays:28,
  expanded:{},
  aufModal:null,aufForm:{},
  posModal:null,posForm:{},posAufId:null,
  istModal:null,istVal:'',
  maModal:null,maForm:{},
  kapModal:null,
  ma:initMA,
  auftraege:initAuf
};

function getMM(){var m={};ST.ma.forEach(function(x){m[x.id]=x;});return m;}

function persist(){lsSave('pdv2_ma',ST.ma);lsSave('pdv2_auf',ST.auftraege);}

function applyUpdate(nextAuf,nextMA){
  var maWZG=nextMA.map(function(m){
    var zg=calcZeitgrad(m.id,nextAuf);
    return Object.assign({},m,{zeitgrad:zg!=null?zg:m.zeitgrad});
  });
  ST.ma=maWZG;
  ST.auftraege=autoScheduleAll(nextAuf,maWZG);
  persist();
  render();
}

// ── Export / Import ──
function exportJSON(){
  var data={version:2,exportedAt:new Date().toISOString(),ma:ST.ma,auftraege:ST.auftraege};
  var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');a.href=url;a.download='dashboard-'+fmtDate(today)+'.json';a.click();
  URL.revokeObjectURL(url);
  showToast('📤 Export erfolgreich!','#6366f1');
}
document.getElementById('importFile').onchange=function(ev){
  var file=ev.target.files[0];if(!file)return;
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var data=JSON.parse(e.target.result);
      if(!data.ma||!data.auftraege)throw new Error('Ungültiges Format');
      if(!confirm('Alle Daten werden überschrieben. Fortfahren?'))return;
      ST.ma=data.ma;ST.auftraege=data.auftraege;
      persist();render();showToast('📥 Import erfolgreich!','#22c55e');
    }catch(err){showToast('❌ '+err.message,'#ef4444');}
  };
  reader.readAsText(file);ev.target.value='';
};

// ── DOM Helpers ──
function mk(tag,css,ch){
  var el=document.createElement(tag);
  if(css)Object.assign(el.style,css);
  if(ch==null)return el;
  (Array.isArray(ch)?ch:[ch]).forEach(function(c){
    if(c==null||c===false)return;
    el.appendChild(typeof c==='string'||typeof c==='number'?document.createTextNode(String(c)):c);
  });
  return el;
}
function D(css,ch){return mk('div',css,ch);}
function SP(css,txt){var s=document.createElement('span');if(css)Object.assign(s.style,css);if(txt!=null)s.textContent=String(txt);return s;}
function BTN(txt,color,sm,fn,outline){
  var c=color||'#6366f1',b=document.createElement('button');
  b.style.cssText='padding:'+(sm?'5px 10px':'8px 16px')+';background:'+(outline?'transparent':c)+';border:1px solid '+c+';border-radius:7px;color:'+(outline?c:'#fff')+';font-size:'+(sm?12:13)+'px;font-weight:600;cursor:pointer;white-space:nowrap;';
  b.textContent=txt;if(fn)b.onclick=fn;return b;
}
function FG(label,val,fn,opts){
  var w=document.createElement('div');w.className='fg';
  if(label){var lb=document.createElement('label');lb.textContent=label;w.appendChild(lb);}
  var f;
  if(opts){
    f=document.createElement('select');
    opts.forEach(function(o){var op=document.createElement('option');op.value=String(o.v!=null?o.v:o);op.textContent=String(o.l!=null?o.l:o);if(String(o.v!=null?o.v:o)===String(val))op.selected=true;f.appendChild(op);});
    f.onchange=function(ev){fn(ev.target.value);};
  } else {
    f=document.createElement('input');f.value=val!=null?String(val):'';
    f.onblur=function(ev){fn(ev.target.value);};
    f.onkeydown=function(ev){if(ev.key==='Enter')fn(ev.target.value);};
  }
  w.appendChild(f);return w;
}
function FGT(label,type,val,fn){
  var w=document.createElement('div');w.className='fg';
  if(label){var lb=document.createElement('label');lb.textContent=label;w.appendChild(lb);}
  var f=document.createElement('input');f.type=type;f.value=val!=null?String(val):'';
  f.onblur=function(ev){fn(ev.target.value);};
  f.onkeydown=function(ev){if(ev.key==='Enter')fn(ev.target.value);};
  w.appendChild(f);return w;
}
function MODAL(title,closeFn,wide,parts){
  var ov=D({position:'fixed',inset:'0',background:'rgba(0,0,0,.75)',zIndex:'100',display:'flex',alignItems:'center',justifyContent:'center'});
  var box=D({background:'#1e293b',borderRadius:'14px',padding:'24px',width:wide?'min(820px,95vw)':'min(460px,95vw)',maxHeight:'90vh',overflowY:'auto',border:'1px solid #334155'});
  var hdr=D({display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'18px'});
  var ttl=document.createElement('b');ttl.style.fontSize='16px';ttl.textContent=title;hdr.appendChild(ttl);
  hdr.appendChild(BTN('×','#a8b8cc',true,closeFn,true));
  box.appendChild(hdr);
  parts.forEach(function(p){if(p)box.appendChild(p);});
  ov.appendChild(box);return ov;
}
function PROG(pct,color){
  var bg=D({background:'#0f172a',borderRadius:'99px',height:'6px'});
  bg.appendChild(D({width:Math.min(pct,100)+'%',background:color||'#6366f1',height:'100%',borderRadius:'99px'}));
  return bg;
}
function badge(s){
  var sp=document.createElement('span');sp.textContent=s;
  sp.style.cssText='display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700;background:'+S_COL[s]+'22;color:'+S_COL[s]+';border:1px solid '+S_COL[s]+'44;white-space:nowrap;';
  return sp;
}

function buildVpKW(mm){
  var vpKW={};
  ST.auftraege.forEach(function(auf){
    (auf.positionen||[]).forEach(function(p){
      if(!p.start||!p.end)return;
      var m=mm[p.maId],gh=geplantHP(p,m),ds=Math.max(1,diffD(p.start,p.end)+1),hpd=gh/ds;
      var cur=parseD(p.start),end=parseD(p.end);
      while(cur<=end){
        if(isWork(cur)){var kw=getKW(cur),k=kwKey(kw.year,kw.kw);if(!vpKW[k])vpKW[k]={_total:0};vpKW[k][p.maId]=(vpKW[k][p.maId]||0)+hpd;vpKW[k]._total=(vpKW[k]._total||0)+hpd;}
        cur=addD(cur,1);
      }
    });
  });
  return vpKW;
}

// ══════════════════════════════════════════════
// TAB: DASHBOARD
// ══════════════════════════════════════════════
function tabDashboard(mm){
  var wrap=D(null);
  var vpKW=buildVpKW(mm);

  // ── KPIs ──
  var offen=0,laeuft=0,fertig=0,posGes=0;
  ST.auftraege.forEach(function(auf){
    var s=calcAuftragStatus(auf);
    if(s==='offen')offen++;else if(s==='läuft')laeuft++;else fertig++;
    posGes+=(auf.positionen||[]).length;
  });
  var zgVals=ST.ma.map(function(m){return calcZeitgrad(m.id,ST.auftraege);}).filter(function(v){return v!==null;});
  var avgZG=zgVals.length?(zgVals.reduce(function(s,v){return s+v;},0)/zgVals.length).toFixed(1):'–';

  var kpiRow=D({display:'flex',gap:'12px',marginBottom:'20px',flexWrap:'wrap'});
  [{l:'Aufträge offen',v:offen,i:'📋',c:'#f59e0b'},{l:'In Bearbeitung',v:laeuft,i:'⚙️',c:'#6366f1'},
   {l:'Fertiggestellt',v:fertig,i:'✅',c:'#22c55e'},{l:'Positionen gesamt',v:posGes,i:'📌',c:'#0ea5e9'},
   {l:'Ø Zeitgrad',v:avgZG+(avgZG!=='–'?'%':''),i:'⏱️',c:'#e879f9'}
  ].forEach(function(k){
    kpiRow.appendChild(D({flex:'1',minWidth:'130px',background:'#1e293b',borderRadius:'12px',padding:'16px',border:'1px solid '+k.c+'33'},[
      D({fontSize:'20px',marginBottom:'6px'},k.i),
      D({fontSize:'22px',fontWeight:'700',color:k.c},String(k.v)),
      D({fontSize:'11px',color:'#a8b8cc',marginTop:'3px'},k.l)
    ]));
  });
  wrap.appendChild(kpiRow);

  // ── Kapazitätschart (SVG) ──
  var allKWs=[];
  for(var wi=1;wi<=52;wi++){
    var wk=kwKey(CY,wi);
    var kapGes=ST.ma.reduce(function(s,m){return s+getKap(m,wk);},0);
    var verp=(vpKW[wk]&&vpKW[wk]._total)||0;
    allKWs.push({label:'KW'+pad(wi),key:wk,kap:+kapGes.toFixed(1),verp:+verp.toFixed(1),ausl:kapGes>0?Math.round(verp/kapGes*100):0});
  }
  var WIN=12,maxOff=allKWs.length-WIN;
  if(!ST._dashOff){ST._dashOff=Math.max(0,Math.min(todayKW.kw-3,maxOff));}
  var dKWs=allKWs.slice(ST._dashOff,ST._dashOff+WIN);
  var curIdx=-1;dKWs.forEach(function(w,i){if(w.key===kwKey(todayKW.year,todayKW.kw))curIdx=i;});

  var chartCard=D({background:'#1e293b',borderRadius:'12px',padding:'18px',marginBottom:'16px',border:'1px solid #334155'});
  var chartHdr=D({display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'12px',flexWrap:'wrap',gap:'8px'});
  var chartLbl=document.createElement('span');chartLbl.style.cssText='font-weight:700;font-size:13px;';
  chartLbl.textContent='📦 Kapazität & Auslastung – '+dKWs[0].label+' bis '+dKWs[dKWs.length-1].label;
  chartHdr.appendChild(chartLbl);
  var navRow=D({display:'flex',gap:'6px'});
  navRow.appendChild(BTN('◀','#6366f1',true,function(){ST._dashOff=Math.max(0,ST._dashOff-1);render();}));
  navRow.appendChild(BTN('Heute','#334155',true,function(){ST._dashOff=Math.max(0,Math.min(todayKW.kw-3,maxOff));render();},true));
  navRow.appendChild(BTN('▶','#6366f1',true,function(){ST._dashOff=Math.min(maxOff,ST._dashOff+1);render();}));
  chartHdr.appendChild(navRow);
  chartCard.appendChild(chartHdr);

  // ── Chart 1: Kapazität & Verplant ──
  function buildBarSVG(data,ci){
    var W=880,H=200,PL=38,PR=16,PT=10,PB=24,cW=W-PL-PR,cH=H-PT-PB;
    var maxH=Math.max(1,Math.max.apply(null,data.map(function(d){return Math.max(d.kap,d.verp);})));
    var p=['<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;display:block">'];
    for(var gi=0;gi<=4;gi++){var gy=PT+cH-(gi/4)*cH;p.push('<line x1="'+PL+'" y1="'+gy+'" x2="'+(W-PR)+'" y2="'+gy+'" stroke="#1e293b" stroke-width="1"/>');p.push('<text x="'+(PL-4)+'" y="'+(gy+4)+'" text-anchor="end" fill="#64748b" font-size="10">'+Math.round(maxH/4*gi)+'h</text>');}
    var bW=Math.max(6,Math.floor(cW/data.length)-8);
    data.forEach(function(d,i){
      var x=PL+i*(cW/data.length)+((cW/data.length)-bW)/2;
      var h1=Math.max(2,(d.kap/maxH)*cH),h2=Math.max(2,(d.verp/maxH)*cH);
      var isCur=i===ci;
      p.push('<rect x="'+x+'" y="'+(PT+cH-h1)+'" width="'+(bW/2-1)+'" height="'+h1+'" fill="'+(isCur?'#fb923c':'#f97316')+'" rx="2" opacity="0.85"/>');
      p.push('<rect x="'+(x+bW/2)+'" y="'+(PT+cH-h2)+'" width="'+(bW/2-1)+'" height="'+h2+'" fill="'+(isCur?'#818cf8':'#6366f1')+'" rx="2" opacity="0.85"/>');
      if(d.kap>0)p.push('<text x="'+x+'" y="'+(PT+cH-h1-3)+'" text-anchor="middle" fill="#f97316" font-size="8">'+d.kap+'</text>');
      if(d.verp>0)p.push('<text x="'+(x+bW/2+bW/4)+'" y="'+(PT+cH-h2-3)+'" text-anchor="middle" fill="#a5b4fc" font-size="8">'+d.verp+'</text>');
      p.push('<text x="'+(x+bW/2)+'" y="'+(H-4)+'" text-anchor="middle" fill="'+(isCur?'#e2e8f0':'#64748b')+'" font-size="'+(isCur?11:9)+'" font-weight="'+(isCur?700:400)+'">'+d.label+'</text>');
    });
    p.push('</svg>');return p.join('');
  }

  // ── Chart 2: Auslastung % ──
  function buildLineSVG(data,ci){
    var W=880,H=200,PL=38,PR=36,PT=10,PB=24,cW=W-PL-PR,cH=H-PT-PB,maxP=120;
    var p=['<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;display:block">'];
    [0,25,50,75,100].forEach(function(v){
      var gy=PT+cH-(v/maxP)*cH,isH=v===100;
      p.push('<line x1="'+PL+'" y1="'+gy+'" x2="'+(W-PR)+'" y2="'+gy+'" stroke="'+(isH?'#ef444455':'#1e293b')+'" stroke-width="'+(isH?1.5:1)+'" stroke-dasharray="'+(isH?'5,3':'0')+'"/>');
      p.push('<text x="'+(PL-4)+'" y="'+(gy+4)+'" text-anchor="end" fill="'+(isH?'#ef4444':'#64748b')+'" font-size="10">'+v+'%</text>');
    });
    p.push('<text x="'+(W-PR+3)+'" y="'+(PT+cH-(100/maxP)*cH+4)+'" fill="#ef4444" font-size="9">100%</text>');
    var pts=data.map(function(d,i){var x=PL+i*(cW/data.length)+(cW/data.length)/2,y=PT+cH-(Math.min(d.ausl,maxP)/maxP)*cH;return x+','+y;});
    var fx=PL+(cW/data.length)/2,lx=PL+(data.length-1)*(cW/data.length)+(cW/data.length)/2;
    p.push('<polygon points="'+fx+','+(PT+cH)+' '+pts.join(' ')+' '+lx+','+(PT+cH)+'" fill="#fbbf2415"/>');
    p.push('<polyline points="'+pts.join(' ')+'" fill="none" stroke="#fbbf24" stroke-width="2"/>');
    data.forEach(function(d,i){
      var x=PL+i*(cW/data.length)+(cW/data.length)/2,y=PT+cH-(Math.min(d.ausl,maxP)/maxP)*cH;
      var dc=d.ausl>100?'#f87171':d.ausl>80?'#fbbf24':'#4ade80';
      var isCur=i===ci;
      p.push('<text x="'+x+'" y="'+(H-4)+'" text-anchor="middle" fill="'+(isCur?'#e2e8f0':'#64748b')+'" font-size="'+(isCur?11:9)+'" font-weight="'+(isCur?700:400)+'">'+d.label+'</text>');
      p.push('<circle cx="'+x+'" cy="'+y+'" r="'+(isCur?5:3)+'" fill="'+dc+'" stroke="#0a0f1e" stroke-width="1.5"/>');
      if(d.ausl>0)p.push('<text x="'+x+'" y="'+(y-8)+'" text-anchor="middle" fill="'+dc+'" font-size="'+(isCur?10:8)+'" font-weight="700">'+d.ausl+'%</text>');
    });
    p.push('</svg>');return p.join('');
  }

  var svg1=document.createElement('div');svg1.innerHTML=buildBarSVG(dKWs,curIdx);chartCard.appendChild(svg1);
  chartCard.appendChild(D({display:'flex',gap:'16px',fontSize:'11px',color:'#64748b',marginTop:'6px'},[SP({color:'#f97316'},'■ Kapazität'),SP({color:'#6366f1'},'■ Verplant')]));
  wrap.appendChild(chartCard);

  // Auslastungs-Chart
  var auslCard=D({background:'#1e293b',borderRadius:'12px',padding:'18px',marginBottom:'16px',border:'1px solid #334155'});
  auslCard.appendChild(D({fontWeight:'700',fontSize:'13px',marginBottom:'12px'},'📈 Auslastung % – '+dKWs[0].label+' bis '+dKWs[dKWs.length-1].label));
  var svg2=document.createElement('div');svg2.innerHTML=buildLineSVG(dKWs,curIdx);auslCard.appendChild(svg2);
  auslCard.appendChild(D({display:'flex',gap:'16px',fontSize:'11px',color:'#64748b',marginTop:'6px'},[SP({color:'#fbbf24'},'— Auslastung %'),SP({color:'#ef4444'},'--- 100% Grenze')]));
  wrap.appendChild(auslCard);

  // ── Scheduling & Warnungen ──
  var bottomRow=D({display:'flex',gap:'14px',flexWrap:'wrap'});

  // Scheduling
  var schedCard=D({flex:'1',minWidth:'260px',background:'#1e293b',borderRadius:'12px',padding:'16px',border:'1px solid #334155'});
  schedCard.appendChild(D({fontWeight:'700',fontSize:'13px',marginBottom:'12px'},'🤖 Auto-Scheduling'));
  ST.ma.forEach(function(m){
    var mPos=[];
    ST.auftraege.forEach(function(auf){(auf.positionen||[]).forEach(function(p){if(p.maId===m.id&&p.status!=='fertig')mPos.push({p:p,auf:auf});});});
    mPos.sort(function(a,b){return (a.p.start||'').localeCompare(b.p.start||'');});
    var zg=calcZeitgrad(m.id,ST.auftraege);
    var zgC=m.zeitgrad>=90?'#22c55e':m.zeitgrad>=70?'#6366f1':'#f59e0b';
    var sec=D({marginBottom:'10px',paddingBottom:'10px',borderBottom:'1px solid #0f172a'});
    var sh=D({fontWeight:'600',fontSize:'12px',marginBottom:'4px'});
    sh.appendChild(document.createTextNode(m.name+' '));
    sh.appendChild(SP({fontSize:'11px',color:zgC},'ZG: '+(zg!=null?zg.toFixed(1)+'%':'–')));
    sec.appendChild(sh);
    if(!mPos.length){sec.appendChild(D({fontSize:'12px',color:'#64748b'},'– keine aktiven Positionen'));}
    else mPos.slice(0,4).forEach(function(x,i){
      sec.appendChild(D({fontSize:'11px',color:'#a8b8cc',padding:'1px 0'},
        (i+1)+'. '+x.auf.nr+' '+x.p.nr+' ('+fmtD(x.p.start)+' → '+fmtD(x.p.end)+')'));
    });
    if(mPos.length>4)sec.appendChild(D({fontSize:'11px',color:'#64748b'},'… '+( mPos.length-4)+' weitere'));
    schedCard.appendChild(sec);
  });
  bottomRow.appendChild(schedCard);

  // Warnungen
  var warns=[];
  ST.auftraege.forEach(function(auf){
    if(!auf.deadline)return;
    (auf.positionen||[]).forEach(function(p){
      if(p.status!=='fertig'&&p.end&&p.end>auf.deadline)warns.push({auf:auf,p:p});
    });
  });
  if(warns.length){
    var wCard=D({flex:'1',minWidth:'260px',background:'#1e293b',borderRadius:'12px',padding:'16px',border:'1px solid #ef4444'});
    wCard.appendChild(D({fontWeight:'700',fontSize:'13px',color:'#ef4444',marginBottom:'12px'},'⚠️ Deadline gefährdet ('+warns.length+')'));
    warns.forEach(function(x){
      wCard.appendChild(D({marginBottom:'8px',padding:'8px',background:'#ef444411',borderRadius:'8px',fontSize:'12px'},[
        D({fontWeight:'600'},x.auf.nr+' '+x.p.nr+' – '+x.p.bez),
        D({color:'#a8b8cc',marginTop:'2px'},(mm[x.p.maId]?mm[x.p.maId].name:'?')+' · Ende: '+fmtD(x.p.end)+' · DL: '+fmtD(x.auf.deadline))
      ]));
    });
    bottomRow.appendChild(wCard);
  }
  wrap.appendChild(bottomRow);
  return wrap;
}

// ══════════════════════════════════════════════
// TAB: AUFTRÄGE
// ══════════════════════════════════════════════
function tabAuftraege(mm){
  var wrap=D(null);

  // Toolbar
  var bar=D({display:'flex',gap:'10px',marginBottom:'16px',flexWrap:'wrap',alignItems:'center'});
  var si=document.createElement('input');
  si.placeholder='🔍 Nr., Bezeichnung, Mitarbeiter, Position...';si.value=ST.search||'';
  si.style.cssText='flex:1;min-width:220px;background:#1e293b;border:1px solid #334155;border-radius:8px;padding:8px 12px;color:#f1f5f9;font-size:13px;';
  var searchTimer=null;
  si.oninput=function(ev){
    clearTimeout(searchTimer);
    var val=ev.target.value;
    searchTimer=setTimeout(function(){
      ST.search=val;
      ST._searchFocus=true;
      render();
    },180);
  };
  bar.appendChild(si);
  var sbRow=D({display:'flex',gap:'6px',flexWrap:'wrap'});
  ['alle','offen','läuft','fertig'].forEach(function(s){
    var c=s==='alle'?'#6366f1':(S_COL[s]||'#6366f1'),active=ST.statusFilter===s;
    var b=document.createElement('button');
    b.style.cssText='padding:5px 11px;border-radius:7px;border:1px solid '+c+';background:'+(active?c:'transparent')+';color:'+(active?'#fff':c)+';font-size:12px;font-weight:600;cursor:pointer;';
    b.textContent=s==='alle'?'Alle':s;
    b.onclick=(function(sv){return function(){ST.statusFilter=sv;render();};})(s);
    sbRow.appendChild(b);
  });
  bar.appendChild(sbRow);
  bar.appendChild(BTN('+ Neuer Auftrag','#6366f1',false,function(){
    ST.aufForm={nr:'',bez:'',deadline:'',notiz:'',positionen:[]};ST.aufModal='new';render();
  }));
  wrap.appendChild(bar);

  // Filter
  var filtered=ST.auftraege.slice();
  if(ST.statusFilter!=='alle')filtered=filtered.filter(function(auf){return calcAuftragStatus(auf)===ST.statusFilter;});
  var q=(ST.search||'').toLowerCase().trim();
  if(q)filtered=filtered.filter(function(auf){
    if(auf.nr.toLowerCase().indexOf(q)>=0)return true;
    if(auf.bez.toLowerCase().indexOf(q)>=0)return true;
    if(auf.notiz&&auf.notiz.toLowerCase().indexOf(q)>=0)return true;
    return (auf.positionen||[]).some(function(p){
      if(p.nr.toLowerCase().indexOf(q)>=0)return true;
      if(p.bez.toLowerCase().indexOf(q)>=0)return true;
      var m=mm[p.maId];
      if(m&&m.name.toLowerCase().indexOf(q)>=0)return true;
      if(m&&m.rolle.toLowerCase().indexOf(q)>=0)return true;
      return false;
    });
  });
  wrap.appendChild(D({fontSize:'12px',color:'#a8b8cc',marginBottom:'14px'},filtered.length+' Auftrag'+(filtered.length!==1?'e':'')));

  filtered.forEach(function(auf){
    var status=calcAuftragStatus(auf);
    var gesamtVorgabe=calcAuftragVorgabe(auf);
    var gesamtIst=(auf.positionen||[]).reduce(function(s,p){return s+(p.istZeit||0);},0);
    var late=status!=='fertig'&&auf.deadline&&(auf.positionen||[]).some(function(p){return p.end&&p.end>auf.deadline;});
    var isOpen=!!ST.expanded['auf_'+auf.id];

    var card=D({background:'#1e293b',borderRadius:'14px',border:'1px solid '+(late?'#ef4444':'#334155'),marginBottom:'14px',overflow:'hidden'});

    // ── Auftrag Header ──
    var aufHdr=D({padding:'14px 16px',display:'flex',gap:'12px',alignItems:'center',cursor:'pointer',flexWrap:'wrap'});
    aufHdr.onclick=(function(id){return function(ev){
      if(ev.target.tagName==='BUTTON'||ev.target.tagName==='SELECT'||ev.target.tagName==='OPTION')return;
      var ex=Object.assign({},ST.expanded);ex['auf_'+id]=!ex['auf_'+id];ST.expanded=ex;render();
    };})(auf.id);

    aufHdr.appendChild(SP({fontSize:'11px',color:'#6366f1',display:'inline-block',transform:isOpen?'rotate(90deg)':'rotate(0deg)',transition:'transform .15s',flexShrink:'0',marginTop:'2px'},'▶'));

    var aufInfo=D({flex:'1',minWidth:'200px'});
    var titleRow=D({display:'flex',alignItems:'center',gap:'8px',flexWrap:'wrap',marginBottom:'5px'});
    titleRow.appendChild(SP({fontWeight:'700',fontSize:'14px'},auf.nr));
    titleRow.appendChild(SP({fontSize:'13px',color:'#cbd5e1'},auf.bez));
    titleRow.appendChild(badge(status));
    if(late)titleRow.appendChild(SP({fontSize:'11px',color:'#ef4444'},'⚠️ Deadline'));
    if(auf.notiz)titleRow.appendChild(SP({fontSize:'11px',color:'#6366f1'},'📝 '+auf.notiz));
    aufInfo.appendChild(titleRow);
    aufInfo.appendChild(D({display:'flex',gap:'14px',fontSize:'12px',color:'#a8b8cc',flexWrap:'wrap'},[
      SP(null,'📋 '+(auf.positionen||[]).length+' Positionen'),
      SP(null,'⏱ '+gesamtVorgabe+'h Vorgabe'),
      SP(null,'🏁 '+(auf.deadline?fmtD(auf.deadline):'keine Deadline'))
    ]));
    aufHdr.appendChild(aufInfo);

    // Progress
    var pct=gesamtVorgabe>0?Math.min(Math.round(gesamtIst/gesamtVorgabe*100),100):0;
    var progWrap=D({minWidth:'130px',maxWidth:'200px',flex:'1'});
    progWrap.appendChild(D({display:'flex',justifyContent:'space-between',fontSize:'11px',color:'#a8b8cc',marginBottom:'4px'},[SP(null,'Ist: '+gesamtIst.toFixed(1)+'h / '+gesamtVorgabe+'h'),SP({color:pct>=100?'#22c55e':'#a8b8cc'},pct+'%')]));
    progWrap.appendChild(PROG(pct,pct>=100?'#22c55e':'#6366f1'));
    aufHdr.appendChild(progWrap);

    // Actions
    var akt=D({display:'flex',gap:'6px',flexShrink:'0'});
    akt.appendChild(BTN('✏️','#6366f1',true,(function(id){return function(ev){ev.stopPropagation();
      var a=ST.auftraege.filter(function(x){return x.id===id;})[0];
      ST.aufForm=JSON.parse(JSON.stringify(a));ST.aufModal='edit';render();
    };})(auf.id)));
    akt.appendChild(BTN('+ Pos','#22c55e',true,(function(id){return function(ev){ev.stopPropagation();
      var a=ST.auftraege.filter(function(x){return x.id===id;})[0];
      ST.posForm={nr:'Pos '+((a.positionen||[]).length+1),bez:'',maId:ST.ma[0]?ST.ma[0].id:1,vorgabe:'',istZeit:0,status:'offen'};
      ST.posAufId=id;ST.posModal='new';render();
    };})(auf.id)));
    akt.appendChild(BTN('🗑','#ef4444',true,(function(id){return function(ev){ev.stopPropagation();
      if(confirm('Auftrag + alle Positionen löschen?'))applyUpdate(ST.auftraege.filter(function(x){return x.id!==id;}),ST.ma);
    };})(auf.id)));
    aufHdr.appendChild(akt);
    card.appendChild(aufHdr);

    // ── Positionen ──
    if(isOpen){
      var posWrap=D({borderTop:'1px solid #334155'});
      var pos=auf.positionen||[];
      if(!pos.length){
        posWrap.appendChild(D({padding:'14px 20px',fontSize:'12px',color:'#64748b',fontStyle:'italic'},'Keine Positionen – klicke "+ Pos" oben.'));
      } else {
        // Tabellen-Header
        posWrap.appendChild(D({
          display:'grid',
          gridTemplateColumns:'70px 1fr 140px 80px 80px 100px 80px 110px',
          gap:'6px',padding:'8px 16px',
          fontSize:'11px',color:'#64748b',background:'#0f172a',borderBottom:'1px solid #1e293b'
        },[SP(null,'Nr.'),SP(null,'Bezeichnung'),SP(null,'Mitarbeiter'),SP(null,'Vorgabe'),SP(null,'Geplant'),SP(null,'Ist / Fortschritt'),SP(null,'Status'),SP(null,'Aktionen')]));

        pos.forEach(function(p){
          var m=mm[p.maId];
          var gh=geplantHP(p,m);
          var istPct=gh>0?Math.min(Math.round((p.istZeit||0)/gh*100),100):0;
          var plateLate=p.status!=='fertig'&&p.end&&auf.deadline&&p.end>auf.deadline;

          var row=D({
            display:'grid',
            gridTemplateColumns:'70px 1fr 140px 80px 80px 100px 80px 110px',
            gap:'6px',padding:'9px 16px',alignItems:'center',
            borderBottom:'1px solid #0f172a',
            background:plateLate?'#ef44440a':'transparent'
          });

          // Nr
          row.appendChild(SP({fontSize:'12px',fontWeight:'700',color:'#6366f1'},p.nr));

          // Bezeichnung + Datum
          var bc=D(null);
          bc.appendChild(D({fontSize:'12px',color:'#f1f5f9'},p.bez));
          bc.appendChild(D({fontSize:'10px',color:'#64748b'},p.start?(fmtD(p.start)+' → '+fmtD(p.end)):'nicht geplant'));
          row.appendChild(bc);

          // MA
          row.appendChild(SP({fontSize:'12px',color:'#cbd5e1',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'},m?m.name:'–'));

          // Vorgabe
          row.appendChild(SP({fontSize:'12px'},p.vorgabe+'h'));

          // Geplant
          row.appendChild(SP({fontSize:'12px',color:'#6366f1'},gh+'h'));

          // Ist + Balken
          var ic=D(null);
          ic.appendChild(D({display:'flex',justifyContent:'space-between',fontSize:'10px',color:'#a8b8cc',marginBottom:'3px'},[SP(null,(p.istZeit||0)+'h'),SP({color:istPct>=100?'#22c55e':'#a8b8cc'},istPct+'%')]));
          ic.appendChild(PROG(istPct,istPct>=100?'#22c55e':'#6366f1'));
          row.appendChild(ic);

          // Status
          var sel=document.createElement('select');
          sel.style.cssText='background:'+S_COL[p.status]+'22;border:1px solid '+S_COL[p.status]+';border-radius:6px;color:'+S_COL[p.status]+';padding:3px 5px;font-size:11px;cursor:pointer;width:100%;';
          ['offen','läuft','fertig'].forEach(function(s){var op=document.createElement('option');op.value=s;op.textContent=s;if(s===p.status)op.selected=true;sel.appendChild(op);});
          sel.onchange=(function(aId,pId){return function(ev){
            var v=ev.target.value;
            var next=ST.auftraege.map(function(a){
              if(a.id!==aId)return a;
              return Object.assign({},a,{positionen:a.positionen.map(function(pp){return pp.id===pId?Object.assign({},pp,{status:v}):pp;})});
            });
            applyUpdate(next,ST.ma);
          };})(auf.id,p.id);
          row.appendChild(sel);

          // Aktionen
          var pa=D({display:'flex',gap:'3px'});
          pa.appendChild(BTN('✏️','#6366f1',true,(function(aId,pId){return function(){
            var a=ST.auftraege.filter(function(x){return x.id===aId;})[0];
            var pp=a.positionen.filter(function(x){return x.id===pId;})[0];
            ST.posForm=Object.assign({},pp);ST.posAufId=aId;ST.posModal='edit';render();
          };})(auf.id,p.id)));
          pa.appendChild(BTN('⏱','#0ea5e9',true,(function(aId,pId){return function(){
            var a=ST.auftraege.filter(function(x){return x.id===aId;})[0];
            var pp=a.positionen.filter(function(x){return x.id===pId;})[0];
            ST.istModal={aufId:aId,pos:pp};ST.istVal=String(pp.istZeit||0);render();
          };})(auf.id,p.id)));
          pa.appendChild(BTN('🗑','#ef4444',true,(function(aId,pId){return function(){
            if(!confirm('Position löschen?'))return;
            var next=ST.auftraege.map(function(a){
              if(a.id!==aId)return a;
              return Object.assign({},a,{positionen:a.positionen.filter(function(pp){return pp.id!==pId;})});
            });
            applyUpdate(next,ST.ma);
          };})(auf.id,p.id)));
          row.appendChild(pa);
          posWrap.appendChild(row);
        });
      }
      card.appendChild(posWrap);
    }
    wrap.appendChild(card);
  });

  if(!filtered.length)wrap.appendChild(D({color:'#cbd5e1',padding:'32px',textAlign:'center'},'Keine Aufträge gefunden.'));
  return wrap;
}

// ══════════════════════════════════════════════
// TAB: GANTT
// ══════════════════════════════════════════════
function tabGantt(mm){
  var CW=26,RH=30,LW=200;
  var dayArr=[];var gd=parseD(ST.ganttStart);
  for(var gi=0;gi<ST.ganttDays;gi++){dayArr.push(new Date(gd));gd=addD(gd,1);}

  var wrap=D(null);
  var ctrl=D({display:'flex',gap:'8px',marginBottom:'16px',alignItems:'center',flexWrap:'wrap'});
  ctrl.appendChild(mk('b',null,'Gantt'));
  ctrl.appendChild(BTN('◀ −1 Wo','#6366f1',true,function(){ST.ganttStart=fmtDate(addD(parseD(ST.ganttStart),-7));render();}));
  ctrl.appendChild(BTN('Heute','#334155',true,function(){ST.ganttStart=fmtDate(today);render();}));
  ctrl.appendChild(BTN('+1 Wo ▶','#6366f1',true,function(){ST.ganttStart=fmtDate(addD(parseD(ST.ganttStart),7));render();}));
  var gsel=document.createElement('select');gsel.style.cssText='background:#1e293b;border:1px solid #334155;border-radius:6px;color:#f1f5f9;padding:5px 8px;font-size:12px;';
  [{v:14,l:'2 Wochen'},{v:28,l:'4 Wochen'},{v:56,l:'8 Wochen'}].forEach(function(o){var op=document.createElement('option');op.value=o.v;op.textContent=o.l;if(o.v===ST.ganttDays)op.selected=true;gsel.appendChild(op);});
  gsel.onchange=function(ev){ST.ganttDays=+ev.target.value;render();};ctrl.appendChild(gsel);
  wrap.appendChild(ctrl);

  var scroll=D({overflowX:'auto'});
  var inner=D({minWidth:(LW+ST.ganttDays*CW)+'px'});

  // Month row
  var months=[],curM=null,mSt=0;
  dayArr.forEach(function(d,i){var mo=d.getMonth();if(mo!==curM){if(curM!==null)months.push({label:dayArr[mSt].toLocaleDateString('de-DE',{month:'long',year:'numeric'}),count:i-mSt});curM=mo;mSt=i;}});
  months.push({label:dayArr[mSt].toLocaleDateString('de-DE',{month:'long',year:'numeric'}),count:dayArr.length-mSt});
  var mRow=D({display:'flex',borderBottom:'1px solid #1e293b'});mRow.appendChild(D({width:LW+'px',flexShrink:'0'}));

      }
      pos.forEach(function(p){
        var m=mm[p.maId];
        var aS=p.start?parseD(p.start):null,aE=p.end?parseD(p.end):null;
        var gs=parseD(ST.ganttStart),ge=addD(gs,ST.ganttDays-1);
        var inView=aS&&aE&&aS<=ge&&aE>=gs;
        var oS=inView?(aS<gs?gs:aS):null,oE=inView?(aE>ge?ge:aE):null;
        var off=oS?Math.max(0,diffD(ST.ganttStart,fmtDate(oS))):0;
        var w=oS&&oE?diffD(fmtDate(oS),fmtDate(oE))+1:0;
        var late=p.status!=='fertig'&&auf.deadline&&p.end&&p.end>auf.deadline;

        var pRow=D({display:'flex',background:'#0a0f1e',borderBottom:'1px solid #1e293b',minHeight:RH+'px'});

          D({display:'flex',alignItems:'center',gap:'6px'},[SP({fontSize:'11px',color:'#6366f1',fontWeight:'700'},p.nr),badge(p.status)]),
          D({fontSize:'10px',color:'#a8b8cc'},p.bez),
          D({fontSize:'10px',color:'#64748b'},(m?m.name:'?')+' · '+p.vorgabe+'h')
        ]));

        var atl=D({position:'relative',flex:'1',height:RH+'px'});
        dayArr.forEach(function(d,i){
          var isWe=!isWork(d),isTod=fmtDate(d)===fmtDate(today);
          var kw=getKW(d),noKap=m&&isWork(d)&&getKap(m,kwKey(kw.year,kw.kw))===0;
          atl.appendChild(D({position:'absolute',left:(i*CW)+'px',width:CW+'px',height:'100%',
            background:isTod?'#6366f122':isWe?'#0f172a':noKap?'#ef444411':'transparent',borderLeft:'1px solid #1e293b'}));
        });
        if(inView&&w>0){
          var b2=D({position:'absolute',left:(off*CW+2)+'px',width:Math.max(w*CW-4,4)+'px',
            height:(RH-8)+'px',top:'4px',background:late?'#ef444433':S_COL[p.status]+'33',
            border:'1.5px solid '+(late?'#ef4444':S_COL[p.status]),borderRadius:'5px',
            overflow:'hidden',padding:'0 5px',display:'flex',alignItems:'center',fontSize:'10px',color:'#f1f5f9'},
            p.nr+': '+p.bez);
          b2.title=p.nr+' – '+p.bez+'\n'+(m?m.name:'?')+' · '+p.vorgabe+'h\n'+fmtD(p.start)+' → '+fmtD(p.end);
          atl.appendChild(b2);
        }
        if(auf.deadline){var dOff2=diffD(ST.ganttStart,auf.deadline);if(dOff2>=0&&dOff2<ST.ganttDays)atl.appendChild(D({position:'absolute',left:(dOff2*CW+CW/2)+'px',top:'0',width:'2px',height:'100%',background:'#ef4444',opacity:'.4'}));}
        pRow.appendChild(atl);inner.appendChild(pRow);
      });

  scroll.appendChild(inner);wrap.appendChild(scroll);
  wrap.appendChild(D({marginTop:'10px',display:'flex',gap:'14px',fontSize:'11px',color:'#64748b',flexWrap:'wrap'},[
    SP(null,'Auftrag-Zeile klicken = aufklappen'),
    SP({color:'#f59e0b'},'■ Offen'),SP({color:'#6366f1'},'■ Läuft'),SP({color:'#22c55e'},'■ Fertig'),
    SP({color:'#ef4444'},'| Auftrag-Deadline'),SP({color:'#ef444488'},'░ keine Kapazität')
  ]));
  return wrap;
}

function tabMitarbeiter(mm){
  var wrap=D(null);

  hdr.appendChild(mk('b',null,'Mitarbeiter & Zeitgrade'));

    var zg=calcZeitgrad(mId,ST.auftraege);

    var card=D({background:'#1e293b',borderRadius:'12px',padding:'20px',border:'1px solid #334155',minWidth:'260px',flex:'1',maxWidth:'420px'});
    var ch=D({display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:'12px'});

    ch.appendChild(D({display:'flex',gap:'6px'},[
      BTN('📅 Kap.','#0ea5e9',true,(function(id){return function(){ST.kapModal=ST.ma.filter(function(x){return x.id===id;})[0];ST.kapYear=CY;render();};})(mId)),
      BTN('✏️','#6366f1',true,(function(id){return function(){ST.maForm=Object.assign({},ST.ma.filter(function(x){return x.id===id;})[0]);ST.maModal='edit';render();};})(mId)),
      BTN('🗑','#ef4444',true,(function(id){return function(){if(confirm('Mitarbeiter löschen?'))applyUpdate(ST.auftraege,ST.ma.filter(function(x){return x.id!==id;}));};})(mId))
    ]));
    card.appendChild(ch);
    card.appendChild(D({fontSize:'12px',color:'#a8b8cc',marginBottom:'4px'},'📋 '+allPos.length+' Pos. gesamt · '+allPos.filter(function(x){return x.p.status!=='fertig';}).length+' aktiv'));
    card.appendChild(D({fontSize:'12px',color:'#a8b8cc',marginBottom:'6px'},'Σ Ist '+sumI.toFixed(1)+'h / Σ Soll '+sumS.toFixed(1)+'h (fertige Pos.)'));
    var zgLine=D({fontSize:'12px',marginBottom:'8px'},'Zeitgrad: ');
    zgLine.appendChild(SP({color:zgC,fontWeight:'700'},zg!=null?zg.toFixed(1)+'%':'– (keine fertigen Positionen)'));
    card.appendChild(zgLine);
    if(zg!=null){var bg=D({background:'#0f172a',borderRadius:'99px',height:'8px',marginBottom:'10px'});bg.appendChild(D({width:Math.min(zg,100)+'%',background:zgC,height:'100%',borderRadius:'99px'}));card.appendChild(bg);}
    var activePos=allPos.filter(function(x){return x.p.status!=='fertig';});
    if(activePos.length){
      card.appendChild(D({fontSize:'11px',color:'#64748b',marginBottom:'4px'},'Aktive Positionen:'));
      activePos.slice(0,5).forEach(function(x){
        card.appendChild(D({fontSize:'11px',color:'#a8b8cc',padding:'2px 0',display:'flex',gap:'8px',alignItems:'center'},[
          SP({color:S_COL[x.p.status],fontSize:'10px'},x.p.status==='läuft'?'⚙':'○'),
          SP(null,x.auf.nr+' '+x.p.nr+' – '+x.p.bez),
          SP({color:'#64748b'},x.p.vorgabe+'h')
        ]));
      });
      if(activePos.length>5)card.appendChild(D({fontSize:'11px',color:'#64748b'},'… '+( activePos.length-5)+' weitere'));

}

  });

  allKWsOfYear(ST.year).forEach(function(w){

    var kapGes=ST.ma.reduce(function(s,m){return s+getKap(m,w.key);},0);
    var verp=(vpKW[w.key]&&vpKW[w.key]._total)||0;
    var ausl=kapGes>0?Math.round(verp/kapGes*100):null;
    var ac=ausl==null?'#a8b8cc':ausl>100?'#ef4444':ausl>80?'#f59e0b':'#22c55e';
    var tr=document.createElement('tr');tr.style.cssText='background:'+(isCur?'#6366f122':'transparent')+';border-bottom:1px solid #1e293b;';

    tdKW.innerHTML='<span style="font-weight:'+(isCur?700:400)+';color:'+(isCur?'#6366f1':'#f1f5f9')+'">'+w.label+'</span><br><span style="font-size:10px;color:#cbd5e1">'+w.monday.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'})+'</span>';
    tr.appendChild(tdKW);
    ST.ma.forEach(function(m){
      var wk=w.key,mId=m.id,val=getKap(m,wk)||'',verpMA=+((vpKW[wk]&&vpKW[wk][mId])||0).toFixed(1),kapVal=parseFloat(val)||0;
      var pct=kapVal>0?Math.round(verpMA/kapVal*100):null,pc=pct==null?'#334155':pct>100?'#ef4444':pct>80?'#f59e0b':'#22c55e';
      var td=document.createElement('td');td.style.cssText='padding:4px 6px;text-align:center;';
      var ki=document.createElement('input');ki.type='number';ki.min=0;ki.max=60;ki.value=val;ki.placeholder='h';
      ki.style.cssText='width:52px;background:#1e293b;border:1px solid #334155;border-radius:5px;padding:3px 5px;color:#f1f5f9;font-size:12px;text-align:center;display:block;margin:0 auto;';
      ki.onblur=(function(wkey,mid){return function(ev){
        var v=ev.target.value;
        var nextMA=ST.ma.map(function(x){if(x.id!==mid)return x;var nk=Object.assign({},x.kap);nk[wkey]=parseFloat(v)||0;return Object.assign({},x,{kap:nk});});
        applyUpdate(ST.auftraege,nextMA);
      };})(wk,mId);
      ki.onkeydown=(function(wkey,mid){return function(ev){if(ev.key==='Enter'){
        var v=ev.target.value;
        var nextMA=ST.ma.map(function(x){if(x.id!==mid)return x;var nk=Object.assign({},x.kap);nk[wkey]=parseFloat(v)||0;return Object.assign({},x,{kap:nk});});
        applyUpdate(ST.auftraege,nextMA);
      }};})(wk,mId);
      td.appendChild(ki);

}

function buildModals(app,mm){

  if(ST.aufModal){

      FG('Status',pf.status||'offen',function(v){ST.posForm.status=v;},['offen','läuft','fertig']),
      FGT('Ist-Zeit (h)','number',String(pf.istZeit||0),function(v){ST.posForm.istZeit=+v;}),
      D({display:'flex',gap:'8px',marginTop:'6px'},[

    var rolleF=FG('Rolle',mf.rolle||'',function(v){ST.maForm.rolle=v;});
    app.appendChild(MODAL(ST.maModal==='new'?'Neuer Mitarbeiter':'Mitarbeiter bearbeiten',function(){ST.maModal=null;render();},false,[
      nameF,rolleF,
      D({fontSize:'12px',color:'#a8b8cc',marginBottom:'12px'},'💡 Zeitgrad wird automatisch aus fertigen Positionen berechnet.'),
      D({display:'flex',gap:'8px'},[
        BTN('💾 Speichern','#6366f1',false,function(){
          var name=nameF.querySelector('input').value.trim(),rolle=rolleF.querySelector('input').value.trim();
          if(!name)return;
          var obj=Object.assign({},mf,{name:name,rolle:rolle,kap:mf.kap||{}});
          var nextMA=mf.id
            ?ST.ma.map(function(x){return x.id===mf.id?obj:x;})
            :[].concat(ST.ma,[Object.assign({},obj,{id:newId(),zeitgrad:100,kap:{}})]);
          applyUpdate(ST.auftraege,nextMA);ST.maModal=null;render();
        }),
        BTN('Abbrechen','#a8b8cc',false,function(){ST.maModal=null;render();},true)
      ])
    ]));
  }

  // Kapazität Modal
  if(ST.kapModal){
    var km=ST.ma.filter(function(x){return x.id===ST.kapModal.id;})[0],kmId=ST.kapModal.id;
    var kwGrid=D({display:'flex',flexWrap:'wrap',gap:'8px',maxHeight:'400px',overflowY:'auto'});
    allKWsOfYear(ST.kapYear).forEach(function(w){
      var isCur=w.kw===todayKW.kw&&w.year===todayKW.year,val=km&&getKap(km,w.key)||'';
      var cell=D({background:isCur?'#6366f122':'#0f172a',borderRadius:'8px',padding:'8px',border:isCur?'1px solid #6366f1':'1px solid #1e293b',minWidth:'90px',flex:'1'});
      cell.appendChild(D({fontSize:'11px',color:isCur?'#6366f1':'#a8b8cc',marginBottom:'4px'},w.label));
      var ki2=document.createElement('input');ki2.type='number';ki2.min=0;ki2.max=60;ki2.value=val;ki2.placeholder='h';
      ki2.style.cssText='width:100%;background:#1e293b;border:1px solid #334155;border-radius:5px;padding:4px 6px;color:#f1f5f9;font-size:12px;';
      ki2.onblur=(function(wk2){return function(ev){
        var v=ev.target.value;
        var nextMA=ST.ma.map(function(mx){if(mx.id!==kmId)return mx;var nk=Object.assign({},mx.kap);nk[wk2]=parseFloat(v)||0;return Object.assign({},mx,{kap:nk});});
        applyUpdate(ST.auftraege,nextMA);
      };})(w.key);
      ki2.onkeydown=(function(wk2){return function(ev){if(ev.key==='Enter'){
        var v=ev.target.value;
        var nextMA=ST.ma.map(function(mx){if(mx.id!==kmId)return mx;var nk=Object.assign({},mx.kap);nk[wk2]=parseFloat(v)||0;return Object.assign({},mx,{kap:nk});});
        applyUpdate(ST.auftraege,nextMA);
      }};})(w.key);
      cell.appendChild(ki2);kwGrid.appendChild(cell);
    });
    app.appendChild(MODAL('Kapazität: '+(km&&km.name||''),function(){ST.kapModal=null;render();},true,[
      D({display:'flex',gap:'8px',alignItems:'center',marginBottom:'16px'},[
        BTN('◀ '+(ST.kapYear-1),'#6366f1',true,function(){ST.kapYear--;render();}),
        D({fontWeight:'700',minWidth:'50px',textAlign:'center'},String(ST.kapYear)),
        BTN((ST.kapYear+1)+' ▶','#6366f1',true,function(){ST.kapYear++;render();}),
        SP({fontSize:'12px',color:'#a8b8cc'},'h/Woche · Enter zum Speichern')
      ]),
      kwGrid,
      D({marginTop:'16px'},BTN('✓ Fertig','#6366f1',false,function(){ST.kapModal=null;render();}))
    ]));
  }
}

// ══════════════════════════════════════════════
// RENDER
// ══════════════════════════════════════════════
function render(){
  try{
    var app=document.getElementById('root');app.innerHTML='';
    var mm=getMM();

    // Header
    var hdr=D({background:'#0f172a',borderBottom:'1px solid #1e293b',padding:'12px 24px',display:'flex',alignItems:'center',gap:'12px',flexWrap:'wrap'});
    hdr.appendChild(SP({fontSize:'22px'},'🔧'));
    hdr.appendChild(D(null,[
      D({fontWeight:'700',fontSize:'17px',color:'#f1f5f9'},'Produktions-Dashboard'),
      D({fontSize:'12px',color:'#a8b8cc'},'Aufträge mit Positionen · Zeitgrad · Auto-Scheduling')
    ]));
    var rightBar=D({marginLeft:'auto',display:'flex',alignItems:'center',gap:'8px',flexWrap:'wrap'});
    var expBtn=document.createElement('button');expBtn.style.cssText='padding:7px 14px;background:#6366f1;border:none;border-radius:8px;color:#fff;font-size:13px;font-weight:700;cursor:pointer;';expBtn.textContent='📤 Export';expBtn.onclick=exportJSON;rightBar.appendChild(expBtn);
    var impBtn=document.createElement('button');impBtn.style.cssText='padding:7px 14px;background:transparent;border:1px solid #6366f1;border-radius:8px;color:#6366f1;font-size:13px;font-weight:700;cursor:pointer;';impBtn.textContent='📥 Import';impBtn.onclick=function(){document.getElementById('importFile').click();};rightBar.appendChild(impBtn);
    rightBar.appendChild(SP({fontSize:'12px',color:'#a8b8cc',whiteSpace:'nowrap'},today.toLocaleDateString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit',year:'numeric'})));
    hdr.appendChild(rightBar);app.appendChild(hdr);

    // Tabs
    var tabBar=D({display:'flex',borderBottom:'1px solid #1e293b',background:'#0f172a',overflowX:'auto',padding:'0 24px'});
    [['dashboard','📊 Dashboard'],['auftraege','📋 Aufträge'],['gantt','📅 Gantt'],['mitarbeiter','👷 Mitarbeiter'],['kapazitaet','🗂 Kapazität']].forEach(function(tk){
      var t=document.createElement('button');t.className='tab'+(ST.tab===tk[0]?' active':'');
      t.textContent=tk[1];t.onclick=(function(k){return function(){ST.tab=k;render();};})(tk[0]);tabBar.appendChild(t);
    });
    app.appendChild(tabBar);

    var content=D({padding:'24px',maxWidth:'1400px',margin:'0 auto'});
    if(ST.tab==='dashboard')content.appendChild(tabDashboard(mm));
    else if(ST.tab==='auftraege')content.appendChild(tabAuftraege(mm));
    else if(ST.tab==='gantt')content.appendChild(tabGantt(mm));
    else if(ST.tab==='mitarbeiter')content.appendChild(tabMitarbeiter(mm));
    else if(ST.tab==='kapazitaet')content.appendChild(tabKapazitaet(mm));
    app.appendChild(content);
    buildModals(app,mm);
    // Fokus nach render wiederherstellen
    if(ST._searchFocus){
      ST._searchFocus=false;
      var sf=app.querySelector('input[placeholder*="Nr."]');
      if(sf){sf.focus();var len=sf.value.length;sf.setSelectionRange(len,len);}
    }

  }catch(err){
    var app2=document.getElementById('root');
    if(app2)app2.innerHTML='<div style="color:#ef4444;padding:40px;background:#1e293b;margin:20px;border-radius:12px;font-size:13px"><b>Fehler:</b> '+err.message+'<br><br><pre style="font-size:11px;overflow:auto;white-space:pre-wrap">'+err.stack+'</pre></div>';
  }
}

render();
})();
</script>
</body>
</html>
